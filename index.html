<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>توقيت مدرسة الغزالي باقة الغربية</title>

  <style>
    @font-face{
      font-family: "HacenScreen";
      src: url("font/Hacen%20Liner%20Screen%20St%20Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root{
      --bg:#f6f2ea;
      --ink:#111;
      --muted:#4a4a4a;

      --top:#9a6a35;
      --top2:#7b542a;

      --red:#c91c1c;
      --line:#cbb9a3;

      --arab:#7a5a34;

      /* تكبير تلقائي حسب الشاشة */
      --s: clamp(14px, 1.7vw, 28px);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      height:100vh;
      width:100vw;
      overflow:hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "HacenScreen", system-ui, Tahoma, Arial, sans-serif;
    }

    /* خلفية عربيسك للحواف (SVG مكرر) */
    .frame{
      height:100vh;
      width:100vw;
      position:relative;
      display:flex;
      align-items:stretch;
      justify-content:center;
      padding: clamp(10px, 1.8vw, 22px);
      background:
        /* حواف يمين ويسار */
        linear-gradient(90deg, rgba(122,90,52,.18), rgba(122,90,52,0) 18%),
        linear-gradient(270deg, rgba(122,90,52,.18), rgba(122,90,52,0) 18%),
        var(--bg);
    }

    .arab-border{
      position:absolute;
      top:0; bottom:0;
      width: clamp(22px, 3.2vw, 48px);
      opacity:.9;
      background-color: transparent;
      background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='40' height='120' viewBox='0 0 40 120'>\
<rect width='40' height='120' fill='none'/>\
<path d='M8,0 C20,12 20,28 8,40 C-4,52 -4,68 8,80 C20,92 20,108 8,120' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/>\
<path d='M32,0 C20,12 20,28 32,40 C44,52 44,68 32,80 C20,92 20,108 32,120' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/>\
</svg>");
      background-repeat: repeat-y;
      background-size: 100% auto;
      filter: saturate(1.1);
    }
    .arab-border.right{ right:0; }
    .arab-border.left{ left:0; transform: scaleX(-1); }

    .board{
      width:min(980px, 100%);
      height:100%;
      background: rgba(246,242,234,.86);
      border: 3px solid var(--line);
      box-shadow: 0 18px 70px rgba(0,0,0,.14);
      position:relative;
      display:flex;
      flex-direction:column;
      padding: clamp(12px, 2vw, 22px);
    }

    /* شريط علوي مثل اللوحة */
    .topbar{
      background: linear-gradient(90deg, var(--top2), var(--top), var(--top2));
      color:#fff;
      border-radius: 10px;
      padding: calc(var(--s)*0.55) calc(var(--s)*0.7);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .topbar .right{
      display:flex; align-items:center; gap:10px;
      font-weight:900;
      font-size: calc(var(--s)*0.95);
      line-height:1.1;
    }
    .logo{
      width: calc(var(--s)*2.0);
      height: calc(var(--s)*2.0);
      border-radius: 10px;
      overflow:hidden;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.35);
      flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .topbar .left{
      font-weight:900;
      font-size: calc(var(--s)*0.85);
      opacity:.95;
      text-align:left;
      white-space:nowrap;
    }

    /* الساعة */
    .clock{
      text-align:center;
      margin-top: calc(var(--s)*0.8);
      font-weight: 1000;
      letter-spacing: 1px;
      color:#111;
    }
    .clock .t{
      font-size: clamp(72px, 10vw, 140px);
      line-height:1;
    }

    /* اليوم + التاريخ */
    .meta{
      text-align:center;
      margin-top: calc(var(--s)*0.35);
      font-weight: 1000;
      line-height:1.2;
    }
    .meta .row1{
      display:flex;
      justify-content:center;
      gap: calc(var(--s)*1.0);
      flex-wrap:wrap;
      font-size: clamp(22px, 3.2vw, 44px);
    }
    .meta .row2{
      margin-top: calc(var(--s)*0.25);
      font-size: clamp(18px, 2.4vw, 34px);
      color:#222;
    }

    /* أوقات الصلاة */
    .times{
      margin-top: calc(var(--s)*0.9);
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: calc(var(--s)*0.6) calc(var(--s)*1.2);
      align-items:start;
      padding: calc(var(--s)*0.5) calc(var(--s)*0.6);
    }

    .col{
      display:flex;
      flex-direction:column;
      gap: calc(var(--s)*0.55);
      font-size: clamp(22px, 3.4vw, 46px);
      font-weight: 1000;
    }

    .item{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      border-bottom: 2px solid rgba(155,120,80,.25);
      padding-bottom: calc(var(--s)*0.25);
    }
    .item .name{ color:#111; }
    .item .val{
      color: var(--red);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      min-width: 6ch;
      text-align:left;
    }

    /* فاصل سفلي */
    .bottom{
      margin-top:auto;
      padding-top: calc(var(--s)*0.6);
      border-top: 3px solid rgba(155,120,80,.35);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-weight:900;
      color:#111;
      font-size: calc(var(--s)*0.95);
    }
    .bottom .small{
      color: var(--muted);
      font-weight:900;
      font-size: calc(var(--s)*0.85);
    }

    /* تنبيه قبل الأذان */
    .alert{
      position:absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid rgba(160,120,40,.35);
      background: rgba(255, 215, 90, .35);
      color:#2a1b06;
      font-weight:1000;
      text-align:center;
      font-size: calc(var(--s)*1.0);
      display:none;
      backdrop-filter: blur(6px);
    }

    /* زر شاشة كاملة */
    .fs{
      position:absolute;
      top: 16px;
      left: 16px;
      border:1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.18);
      color:#fff;
      border-radius: 12px;
      padding: 8px 12px;
      font-weight:1000;
      cursor:pointer;
    }
    .fs:active{ transform: translateY(1px); }
  </style>
</head>

<body>
  <div class="frame">
    <div class="arab-border right"></div>
    <div class="arab-border left"></div>

    <div class="board">
      <button class="fs" id="fsBtn">📺 شاشة كاملة</button>

      <div class="topbar">
        <div class="right">
          <div class="logo"><img id="logoImg" src="logo.png" alt="logo"></div>
          <div>
            توقيت مدرسة الغزالي<br/>
            باقة الغربية
          </div>
        </div>
        <div class="left" id="locText">باقـة الغربية - إسرائيل</div>
      </div>

      <div class="clock">
        <div class="t" id="clockText">00:00:00</div>
      </div>

      <div class="meta">
        <div class="row1">
          <div id="dowText">—</div>
          <div id="monthText">—</div>
        </div>
        <div class="row2" id="gregText">—</div>
        <div class="row2" id="hijriText" style="margin-top:8px;">—</div>
      </div>

      <div class="times" aria-label="أوقات الأذان فقط">
        <div class="col">
          <div class="item"><span class="name">الفجر</span><span class="val" id="fajr">--:--</span></div>
          <div class="item"><span class="name">الظهر</span><span class="val" id="dhuhr">--:--</span></div>
          <div class="item"><span class="name">العصر</span><span class="val" id="asr">--:--</span></div>
        </div>

        <div class="col">
          <div class="item"><span class="name">المغرب</span><span class="val" id="maghrib">--:--</span></div>
          <div class="item"><span class="name">العشاء</span><span class="val" id="isha">--:--</span></div>
          <div class="item"><span class="name">الشروق</span><span class="val" id="sunrise">--:--</span></div>
        </div>
      </div>

      <div class="bottom">
        <div class="small" id="noteText">فروقات محلية مفعّلة: فجر +2، ظهر +1، عصر +3، مغرب +10</div>
        <div class="small" id="tzText">Asia/Jerusalem</div>
      </div>

      <div class="alert" id="alertBar"></div>
    </div>
  </div>

<script>
  // ======================
  // إعدادات ثابتة لباقـة الغربية
  // ======================
  const CONFIG = {
    label: "باقـة الغربية - إسرائيل",
    lat: 32.4169,
    lon: 35.0405,
    tz: "Asia/Jerusalem",

    // طريقة الحساب (يمكن تغييرها لاحقًا إن رغبت)
    method: 3, // Muslim World League غالبًا مناسب

    // فروقاتك بالدقائق
    offsets: {
      Fajr: 2,
      Dhuhr: 1,
      Asr: 3,
      Maghrib: 10,
      Isha: 0,
      Sunrise: 0
    },

    // تنبيه قبل الأذان (دقائق)
    preAlertMinutes: {
      Fajr: 10,
      Dhuhr: 10,
      Asr: 10,
      Maghrib: 10,
      Isha: 10
    },

    beep: true
  };

  const $ = (id)=>document.getElementById(id);
  function pad(n){ return String(n).padStart(2,"0"); }
  function cleanHHMM(s){ return (s||"").replace(/[^\d:]/g,"").slice(0,5); }

  function nowTZ(){
    // نعرض الوقت حسب منطقة القدس
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: CONFIG.tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"
    }).formatToParts(new Date());
    return {
      hh: parts.find(p=>p.type==="hour")?.value || "00",
      mm: parts.find(p=>p.type==="minute")?.value || "00",
      ss: parts.find(p=>p.type==="second")?.value || "00"
    };
  }

  function setClockAndDates(){
    const {hh,mm,ss} = nowTZ();
    $("clockText").textContent = `${hh}:${mm}:${ss}`;

    const d = new Date();
    $("dowText").textContent = new Intl.DateTimeFormat("ar", { weekday:"long", timeZone: CONFIG.tz }).format(d);
    $("monthText").textContent = new Intl.DateTimeFormat("ar", { month:"long", timeZone: CONFIG.tz }).format(d);

    const greg = new Intl.DateTimeFormat("en-CA", { year:"numeric", month:"2-digit", day:"2-digit", timeZone: CONFIG.tz }).format(d);
    $("gregText").textContent = greg; // مثل 2017-09-19
  }

  function addMinutesToHHMM(hhmm, addMin){
    const clean = cleanHHMM(hhmm);
    const [h,m] = clean.split(":").map(Number);
    const base = new Date();
    base.setHours(h, m, 0, 0);
    base.setMinutes(base.getMinutes() + (addMin||0));
    return `${pad(base.getHours())}:${pad(base.getMinutes())}`;
  }

  function toDateKey(d){
    const day = new Intl.DateTimeFormat("en-GB",{day:"2-digit",timeZone:CONFIG.tz}).format(d);
    const month = new Intl.DateTimeFormat("en-GB",{month:"2-digit",timeZone:CONFIG.tz}).format(d);
    const year = new Intl.DateTimeFormat("en-GB",{year:"numeric",timeZone:CONFIG.tz}).format(d);
    return `${day}-${month}-${year}`; // DD-MM-YYYY
  }

  async function fetchTimings(){
    const dateKey = toDateKey(new Date());
    const url =
      `https://api.aladhan.com/v1/timings/${dateKey}` +
      `?latitude=${encodeURIComponent(CONFIG.lat)}` +
      `&longitude=${encodeURIComponent(CONFIG.lon)}` +
      `&method=${encodeURIComponent(CONFIG.method)}`;

    const r = await fetch(url);
    if(!r.ok) throw new Error("Fetch failed");
    const j = await r.json();
    if(j.code !== 200) throw new Error("Bad response");
    return j.data;
  }

  let timingsAdj = null;
  let fired = new Set();

  function parseToday(hhmm, dayOffset=0){
    const clean = cleanHHMM(hhmm);
    const [h,m] = clean.split(":").map(Number);
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
    d.setDate(d.getDate() + dayOffset);
    return d;
  }

  function beep(){
    if(!CONFIG.beep) return;
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.value = 0.06;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      setTimeout(()=>{ o.stop(); ctx.close(); }, 350);
    }catch{}
  }

  function showAlert(text){
    const el = $("alertBar");
    el.textContent = text;
    el.style.display = "block";
    beep();
    setTimeout(()=>{ el.style.display="none"; }, 12000);
  }

  function handlePreAlerts(){
    if(!timingsAdj) return;

    const now = new Date();
    const keys = ["Fajr","Dhuhr","Asr","Maghrib","Isha"];

    for(const k of keys){
      const mins = CONFIG.preAlertMinutes[k];
      if(mins == null) continue;

      const at = parseToday(timingsAdj[k], 0);
      const pre = new Date(at.getTime() - mins*60*1000);

      const stamp = `${new Date().toDateString()}|${k}|${mins}`;
      if(fired.has(stamp)) continue;

      if(Math.abs(now - pre) <= 15000){
        const nameAr = ({Fajr:"الفجر",Dhuhr:"الظهر",Asr:"العصر",Maghrib:"المغرب",Isha:"العشاء"})[k] || k;
        showAlert(`🌙 تنبيه: باقي ${mins} دقيقة على أذان ${nameAr}`);
        fired.add(stamp);
      }
    }
  }

  function fillTimes(){
    $("fajr").textContent = timingsAdj.Fajr;
    $("dhuhr").textContent = timingsAdj.Dhuhr;
    $("asr").textContent = timingsAdj.Asr;
    $("maghrib").textContent = timingsAdj.Maghrib;
    $("isha").textContent = timingsAdj.Isha;
    $("sunrise").textContent = timingsAdj.Sunrise;
  }

  async function load(){
    $("locText").textContent = CONFIG.label;
    $("tzText").textContent = CONFIG.tz;

    const data = await fetchTimings();

    // هجري مثل: 18 ذو الحجة 1438
    const h = data.date?.hijri;
    if(h){
      const hijri = `${h.day} ${h.month?.ar || ""} ${h.year}`;
      $("hijriText").textContent = hijri;
    } else {
      $("hijriText").textContent = "—";
    }

    // تطبيق الفروقات
    const t = data.timings;
    timingsAdj = {
      Fajr:    addMinutesToHHMM(t.Fajr,    CONFIG.offsets.Fajr || 0),
      Dhuhr:   addMinutesToHHMM(t.Dhuhr,   CONFIG.offsets.Dhuhr || 0),
      Asr:     addMinutesToHHMM(t.Asr,     CONFIG.offsets.Asr || 0),
      Maghrib: addMinutesToHHMM(t.Maghrib, CONFIG.offsets.Maghrib || 0),
      Isha:    addMinutesToHHMM(t.Isha,    CONFIG.offsets.Isha || 0),
      Sunrise: addMinutesToHHMM(t.Sunrise, CONFIG.offsets.Sunrise || 0)
    };

    fillTimes();
  }

  // شاشة كاملة
  $("fsBtn").addEventListener("click", ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.();
    }else{
      document.exitFullscreen?.();
    }
  });

  // تشغيل
  const logo = $("logoImg");
  logo.onerror = ()=>{ logo.style.display="none"; };

  setClockAndDates();
  setInterval(()=>{ setClockAndDates(); handlePreAlerts(); }, 1000);

  load().catch(console.error);
  setInterval(()=>load().catch(()=>{}), 6*60*60*1000);
</script>
</body>
</html>
