<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شاشة أوقات الأذان | مدرسة الغزالي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

  <!-- خلفية الصور -->
  <div id="eventsLayer" class="events-layer" aria-hidden="true"></div>
  <div class="page-overlay" aria-hidden="true"></div>

  <div class="app-shell">

    <!-- ترويسة خضراء -->
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-brand">
          <img src="logo.png" alt="شعار مدرسة الغزالي" class="site-brand__logo" />
          <div class="site-brand__text">
            <h1 class="site-brand__title">مدرسة الغزالي</h1>
            <p class="site-brand__subtitle">شاشة أوقات الأذان في باقة الغربية</p>
          </div>
        </div>
      </div>
      <div class="site-header__gold-line"></div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-layout">

      <!-- الساعة والتاريخ -->
      <section class="clock-card">
        <div id="clock" class="clock">00:00:00</div>
        <div id="dateLine" class="date-line">الاثنين | 01-01-2026</div>
        <div id="hijriDate" class="hijri-date"></div>
        <div id="weatherNow" class="weather-now">الطقس: --°</div>
      </section>

      <!-- الحصة الحالية (تظهر في أيام الدوام فقط) -->
      <section id="scheduleCard" class="schedule-card hidden" aria-live="polite">
        <div id="scheduleTitle" class="schedule-card__title"></div>
        <div id="scheduleDetail" class="schedule-card__detail"></div>
        <div class="schedule-card__bar" aria-hidden="true">
          <div id="scheduleBar" class="schedule-card__bar-fill"></div>
        </div>
      </section>

      <!-- إعلانات اليوم (تظهر عند وجودها فقط) -->
      <section id="announcementsCard" class="announcements-card hidden" aria-live="polite"></section>

      <!-- مواقيت الصلاة -->
      <section class="prayer-times-card" aria-labelledby="prayerTimesHeading">
        <div class="section-title-wrap">
          <h2 id="prayerTimesHeading" class="section-title">مواقيت الصلاة</h2>
        </div>
        <div id="prayerTimesList" class="prayer-times-list">
          <!-- يتم تعبئته من JS -->
        </div>
      </section>

      <!-- خانة متناوبة: اقتباس تربوي ولوحة تقدير -->
      <section class="quote-card" aria-live="polite">
        <div id="highlightBody" class="highlight-body">
          <p id="rotatingQuote" class="quote-text">كل طالب يسير في طريقه... ونحن نضيء له الاتجاه</p>
          <div id="honorSlot" class="honor hidden"></div>
        </div>
      </section>

      <!-- توقعات الطقس -->
      <section class="forecast-card" aria-labelledby="forecastHeading">
        <div class="section-title-wrap">
          <h2 id="forecastHeading" class="section-title">توقعات الطقس للأيام القادمة</h2>
        </div>
        <div id="forecast3Days" class="forecast-grid">
          <!-- يتم تعبئته من JS -->
        </div>
      </section>

      <!-- تهنئة الميلاد (تظهر عند وجودها فقط) -->
      <aside id="birthdayCard" class="birthday-card hidden" aria-live="polite"></aside>

    </main>

    <!-- الشريط السفلي -->
    <footer class="bottom-ticker" aria-label="رسائل مدرسية">
      <div class="bottom-ticker__track">
        <div id="tickerTrack" class="bottom-ticker__content">
          <span>مرحبًا بكم في مدرسة الغزالي</span>
          <span class="sep">•</span>
          <span>الهدوء أثناء الاصطفاف</span>
          <span class="sep">•</span>
          <span>النظام من جمال المكان</span>
        </div>
      </div>
    </footer>

  </div>

  <script src="assets/js/prayer.js"></script>
  <script src="assets/js/schedule.js"></script>
  <script src="assets/js/weather.js"></script>
  <script src="assets/js/events.js"></script>
  <script src="assets/js/school-feed.js"></script>
  <script src="assets/js/birthdays.js"></script>
  <script src="assets/js/announcements.js"></script>
  <script src="assets/js/highlight.js"></script>
  <script src="assets/js/ticker.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
