<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">  
  <meta http-equiv="Expires" content="0">
  <title>توقيت الأذان في مدرسة الغزالي باقة الغربية</title>

  <style>
    @font-face{
      font-family: "HacenScreen";
      src: url("font/Hacen%20Liner%20Screen%20St%20Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root{
      --bg:#f6f2ea;
      --ink:#111;
      --muted:#4a4a4a;

      --top:#9a6a35;
      --top2:#7b542a;

      --red:#c91c1c;

      --green-bg: #e8f5e9;
      --green-border: #2e7d32;
      --green-text: #1b5e20;

      --line:#cbb9a3;
      --arab:#7a5a34;

      --s: clamp(16px, 2.15vw, 34px);

      --tickerSpeed: 28s;
      --verseSpeed: 40s;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      height:100vh;
      width:100vw;
      overflow:hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "HacenScreen", system-ui, Tahoma, Arial, sans-serif;
    }

    @keyframes antiBurn {
      0% { transform: translate(0, 0); }
      25% { transform: translate(2px, 1px); }
      50% { transform: translate(0, 2px); }
      75% { transform: translate(-2px, 1px); }
      100% { transform: translate(0, 0); }
    }

    .frame{
      height:100vh;
      width:100vw;
      position:relative;
      display:flex;
      align-items:stretch;
      justify-content:center;
      padding: clamp(10px, 1.8vw, 22px);
      background:
        linear-gradient(90deg, rgba(122,90,52,.18), rgba(122,90,52,0) 18%),
        linear-gradient(270deg, rgba(122,90,52,.18), rgba(122,90,52,0) 18%),
        var(--bg);
      animation: antiBurn 300s infinite alternate linear;
    }

    .arab-border{
      position:absolute;
      top:0; bottom:0;
      width: clamp(22px, 3.2vw, 52px);
      opacity:.9;
      background-color: transparent;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='120' viewBox='0 0 40 120'><rect width='40' height='120' fill='none'/><path d='M8,0 C20,12 20,28 8,40 C-4,52 -4,68 8,80 C20,92 20,108 8,120' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/><path d='M32,0 C20,12 20,28 32,40 C44,52 44,68 32,80 C20,92 20,108 32,120' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/></svg>");
      background-repeat: repeat-y;
      background-size: 100% auto;
      filter: saturate(1.1);
      pointer-events:none;
    }
    .arab-border.right{ right:0; }
    .arab-border.left{ left:0; transform: scaleX(-1); }

    .board{
      width:min(1100px, 100%);
      height:100%;
      background: rgba(246,242,234,.90);
      border: 3px solid var(--line);
      box-shadow: 0 18px 70px rgba(0,0,0,.14);
      position:relative;
      display:flex;
      flex-direction:column;
      padding: clamp(12px, 2vw, 24px);
      border-radius: 16px;
      overflow:hidden;
      isolation:isolate;
    }

    /* ✅ زخارف الخلفية كما كانت */
    .board::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:0;
      opacity:.28;
      background-repeat:no-repeat;
      background-size: 170px 170px, 170px 170px, 170px 170px, 170px 170px;
      background-position: top 8px right 8px, top 8px left 8px, bottom 8px right 8px, bottom 8px left 8px;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><path d='M160 20c-35 0-60 25-60 60 0 10 2 19 6 27-8-4-17-6-27-6-35 0-60 25-60 60' fill='none' stroke='%237a5a34' stroke-width='8' stroke-linecap='round'/><path d='M160 20c-22 10-35 28-36 60' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/><circle cx='160' cy='20' r='6' fill='%237a5a34'/></svg>"),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><g transform='translate(180,0) scale(-1,1)'><path d='M160 20c-35 0-60 25-60 60 0 10 2 19 6 27-8-4-17-6-27-6-35 0-60 25-60 60' fill='none' stroke='%237a5a34' stroke-width='8' stroke-linecap='round'/><path d='M160 20c-22 10-35 28-36 60' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/><circle cx='160' cy='20' r='6' fill='%237a5a34'/></g></svg>"),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><g transform='translate(0,180) scale(1,-1)'><path d='M160 20c-35 0-60 25-60 60 0 10 2 19 6 27-8-4-17-6-27-6-35 0-60 25-60 60' fill='none' stroke='%237a5a34' stroke-width='8' stroke-linecap='round'/><path d='M160 20c-22 10-35 28-36 60' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/><circle cx='160' cy='20' r='6' fill='%237a5a34'/></g></svg>"),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><g transform='translate(180,180) scale(-1,-1)'><path d='M160 20c-35 0-60 25-60 60 0 10 2 19 6 27-8-4-17-6-27-6-35 0-60 25-60 60' fill='none' stroke='%237a5a34' stroke-width='8' stroke-linecap='round'/><path d='M160 20c-22 10-35 28-36 60' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/><circle cx='160' cy='20' r='6' fill='%237a5a34'/></g></svg>");
    }

    .grain{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      opacity:.06;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.35'/></svg>");
      background-size: 220px 220px;
      mix-blend-mode:multiply;
    }

    /* =========================
       ✅ منظومة صور الخلفية (مثل الملف القديم)
       ========================= */
    .eventsLayer{
      position:absolute;
      inset:0;
      z-index:0;
      opacity:0;
      transition: opacity 900ms ease;
      pointer-events:none;
    }
    .eventsLayer .eventsOverlay{
      position:absolute;
      inset:0;
      background: radial-gradient(circle at 50% 35%, rgba(246,242,234,.25), rgba(246,242,234,.72) 65%, rgba(246,242,234,.86));
      mix-blend-mode: normal;
    }
    .eventsLayer img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      transform: scale(1.05);
      filter: blur(2px) saturate(1.05) brightness(.92) contrast(.98);
      opacity:0;
      transition: opacity 900ms ease;
    }
    .eventsLayer img.show{ opacity:1; }

    .content{
      position:relative;
      z-index:1;
      height:100%;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      background: linear-gradient(90deg, var(--top2), var(--top), var(--top2));
      color:#fff;
      border-radius: 12px;
      padding: calc(var(--s)*0.62) calc(var(--s)*0.8);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    body[data-ramadan="1"] .topbar{
      background: linear-gradient(90deg, #6f4b18, #c9a14a, #6f4b18);
      box-shadow: 0 10px 30px rgba(201,161,74,.22);
    }

    .topbar .right{
      display:flex; align-items:center; gap:12px;
      font-weight:1000;
      font-size: calc(var(--s)*1.05);
      line-height:1.1;
    }
    .logo{
      width: calc(var(--s)*2.1);
      height: calc(var(--s)*2.1);
      border-radius: 12px;
      overflow:hidden;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.35);
      flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .topbar .left{
      font-weight:1000;
      font-size: calc(var(--s)*0.90);
      opacity:.95;
      text-align:left;
      white-space:nowrap;
    }

    .clock{
      text-align:center;
      margin-top: calc(var(--s)*0.60);
      font-weight: 1000;
      letter-spacing: 1px;
      color:#111;
    }
    .clock .t{
      font-size: clamp(70px, 10vw, 140px);
      line-height:1;
    }

    .meta{
      text-align:center;
      margin-top: calc(var(--s)*0.25);
      font-weight: 1000;
      line-height:1.2;
    }
    .meta .row1{
      display:flex;
      justify-content:center;
      gap: calc(var(--s)*1.0);
      flex-wrap:wrap;
      font-size: clamp(20px, 2.8vw, 42px);
    }
    .meta .row2{
      margin-top: calc(var(--s)*0.15);
      font-size: clamp(16px, 2.1vw, 32px);
      color:#222;
    }

    .weather-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      margin-bottom: 5px;
      background-color: rgba(123, 84, 42, 0.08);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      padding: 6px 20px;
      border-radius: 50px;
      border: 1px solid rgba(123, 84, 42, 0.15);
      color: #7b542a;
      font-weight: 1000;
      font-size: clamp(16px, 2.0vw, 30px);
    }
    .w-icon { font-size: 1.3em; margin-top:-4px; }
    .w-temp { direction: ltr; font-weight:1000; }
	.forecast-3{
	  width: fit-content;
	  margin: 10px auto 0;
	  padding: 10px 14px;
      border-radius: 16px;
      border: 1px solid rgba(123, 84, 42, 0.15);
      background: rgba(123, 84, 42, 0.06);
      color: #7b542a;
      font-weight: 1000;
      font-size: clamp(14px, 1.6vw, 24px);
    }
	.forecast-3 .grid{
	  display:flex;
	  gap: 10px;
	  justify-content: center;
	}
	
	.forecast-3 .card{
	  min-width: 120px;
	  text-align:center;
	  padding: 8px 12px;
	  border-radius: 14px;
	  background: rgba(255,255,255,0.55);
	  border: 1px solid rgba(123, 84, 42, 0.14);
	}
	.forecast-3 .lbl{ opacity:.95; }
	.forecast-3 .ico{ font-size: 1.35em; margin-top: 4px; }
	.forecast-3 .temps{ direction:ltr; margin-top: 4px; color:#5a3f22; }

    .times{
      margin-top: calc(var(--s)*0.55);
      display:flex;
      flex-direction:column;
      gap: calc(var(--s)*0.52);
      padding: calc(var(--s)*0.55) calc(var(--s)*0.65);
      border-radius: 14px;
    }

    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom: 2px solid rgba(155,120,80,.25);
      padding: calc(var(--s)*0.18) 0 calc(var(--s)*0.25);
      font-size: clamp(24px, 3.2vw, 50px);
      font-weight:1000;
      transition: all 0.5s ease;
    }
    .item .name{ color:#111; display:flex; align-items:center; gap: 15px; }
    .item .name .icon { font-size: 1.2em; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1)); }

    .item .val{
      color: var(--red);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      min-width: 7ch;
      text-align:right;
      direction:ltr;
      display:inline-flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
    }

    .item.next{
      border-bottom-color: var(--green-border);
      background: var(--green-bg);
      border-radius: 16px;
      padding-inline: calc(var(--s)*0.6);
      box-shadow: 0 0 15px rgba(46, 125, 50, 0.15);
      border: 2px solid var(--green-border);
      transform: scale(1.02);
    }
    .item.next .val { color: var(--green-text); }
    .item.next .name { color: var(--green-text); }

    .badge-next{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size: .65em;
      color: var(--green-text);
      opacity:.95;
      margin-inline-start: 10px;
      white-space:nowrap;
      background: rgba(255,255,255,0.6);
      padding: 2px 10px;
      border-radius: 20px;
    }
    .badge-dot{
      width:10px;height:10px;border-radius:50%;
      background: #43a047;
      box-shadow: 0 0 0 4px rgba(67, 160, 71, 0.2);
      flex:0 0 auto;
      animation: pulseGreen 2s infinite;
    }
    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(67, 160, 71, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(67, 160, 71, 0); }
      100% { box-shadow: 0 0 0 0 rgba(67, 160, 71, 0); }
    }

    .countdown{
      margin-top: calc(var(--s)*0.55);
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid rgba(90,150,210,.35);
      background: rgba(160, 210, 255, .22);
      color:#0b1d2a;
      font-weight:1000;
      text-align:center;
      font-size: calc(var(--s)*1.05);
    }

    .verseWrap{
      margin-top: calc(var(--s)*0.45);
      display:flex;
      align-items:center;
      gap:12px;
      padding: 0 calc(var(--s)*0.65);
    }
    .verseLabel{
      font-weight:1000;
      color:#7b542a;
      font-size: calc(var(--s)*0.88);
      white-space:nowrap;
      opacity:.95;
    }
    .verseBar{
      flex: 1 1 auto;
      overflow:hidden;
      border-radius: 12px;
      background: rgba(122,90,52,.08);
      border: 2px solid rgba(122,90,52,.18);
      height: calc(var(--s)*2.55);
      padding-block: 6px;
      display:flex;
      align-items:center;
    }
    .verseTrack{
      display:inline-flex;
      align-items:center;
      white-space:nowrap;
      padding-inline: 22px;
      font-weight:1000;
      font-size: calc(var(--s)*0.98);
      color:#111;
      line-height:1.2;
      animation: verseMove var(--verseSpeed) linear infinite;
    }
    @keyframes verseMove{
      0%{ transform: translateX(-10%); }
      100%{ transform: translateX(110%); }
    }

    body[data-ramadan="1"] .verseBar{
      background: rgba(201,161,74,.12);
      border-color: rgba(201,161,74,.35);
    }

    .ramadanLine{
      margin-top: calc(var(--s)*0.35);
      margin-inline: calc(var(--s)*0.65);
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid rgba(201,161,74,.45);
      background: rgba(201,161,74,.13);
      color:#5b3b10;
      font-weight:1000;
      text-align:center;
      font-size: calc(var(--s)*1.02);
      line-height:1.25;
      display:none;
    }
    body[data-ramadan="1"] .ramadanLine{ display:block; }

    .tickerWrap{
      margin-top:auto;
      border-top: 3px solid rgba(155,120,80,.35);
      padding-top: calc(var(--s)*0.55);
      display:flex;
      align-items:center;
    }
    .ticker{
      position:relative;
      flex:1 1 auto;
      overflow:hidden;
      border-radius: 12px;
      background: rgba(155,120,80,.10);
      border: 2px solid rgba(155,120,80,.22);
      height: calc(var(--s)*2.05);
      display:flex;
      align-items:center;
    }
    body[data-ramadan="1"] .ticker{
      background: rgba(201,161,74,.12);
      border-color: rgba(201,161,74,.30);
    }
    .ticker .track{
      display:inline-flex;
      align-items:center;
      gap: 34px;
      white-space:nowrap;
      padding-inline: 18px;
      font-weight:1000;
      font-size: calc(var(--s)*0.95);
      color:#111;
      animation: tickerMove var(--tickerSpeed) linear infinite;
    }
    @keyframes tickerMove{
      0%{ transform: translateX(-10%); }
      100%{ transform: translateX(110%); }
    }

    .alert{
      position:absolute;
      left: 18px;
      right: 18px;
      bottom: 126px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid rgba(160,120,40,.35);
      background: rgba(255, 215, 90, .32);
      color:#2a1b06;
      font-weight:1000;
      text-align:center;
      font-size: calc(var(--s)*1.05);
      display:none;
      backdrop-filter: blur(6px);
      z-index:6;
    }

    /* =========================
       ✅ صندوق التهنئة (طلاب/معلمين)
       ========================= */
    .birthday{
      position:absolute;
      inset: 20% 10%;
      background: linear-gradient(135deg,#fff7e6,#ffe3b3);
      border: 3px solid #c9a14a;
      border-radius: 26px;
      text-align:center;
      padding: clamp(18px, 3vw, 46px);
      font-size: clamp(30px,4vw,66px);
      font-weight:1000;
      box-shadow: 0 30px 80px rgba(0,0,0,.25);
      display:none;
      z-index:7;
    }
    .birthday .sub{
      margin-top: 10px;
      font-size: .70em;
      color:#2a1b06;
      opacity:.95;
    }

    .verseTrack{ animation: verseMove var(--verseSpeed) linear infinite !important; }
	/* =========================
   ✅ Portrait fit: لا قصّ بعد إضافة توقعات الطقس
   ========================= */
@media (orientation: portrait){
  :root{
    /* تصغير عام بسيط (مهم في العمودي) */
    --s: clamp(14px, 1.55vw, 28px);
  }

  /* تقليل padding العام */
  .frame{ padding: clamp(8px, 1.2vw, 14px); }
  .board{ padding: clamp(10px, 1.4vw, 18px); }

  /* تقليل المسافات العمودية */
  .clock{ margin-top: calc(var(--s)*0.25); }
  .meta{ margin-top: calc(var(--s)*0.10); }
  .times{ margin-top: calc(var(--s)*0.30); gap: calc(var(--s)*0.34); padding: calc(var(--s)*0.40) calc(var(--s)*0.55); }
  .countdown{ margin-top: calc(var(--s)*0.30); padding: 10px 12px; }
  .verseWrap{ margin-top: calc(var(--s)*0.28); }
  .tickerWrap{ padding-top: calc(var(--s)*0.35); }

  /* تصغير الساعة قليلاً */
  .clock .t{ font-size: clamp(56px, 6.8vw, 112px); }

  /* تصغير التاريخ + السطور */
  .meta .row1{ font-size: clamp(18px, 2.1vw, 34px); }
  .meta .row2{ font-size: clamp(14px, 1.6vw, 26px); }

  /* تصغير سطر الطقس */
  .weather-row{
    margin-top: 8px;
    padding: 5px 16px;
    gap: 10px;
    font-size: clamp(14px, 1.5vw, 24px);
  }

  /* ✅ تصغير بطاقات توقعات 3 أيام */
  .forecast-3{ margin: 8px auto 0; padding: 8px 10px; }
  .forecast-3 .grid{ gap: 8px; }
  .forecast-3 .card{
    min-width: 96px;
    padding: 6px 8px;
  }
  .forecast-3 .ico{ font-size: 1.2em; margin-top: 2px; }
  .forecast-3 .temps{ margin-top: 2px; }

  /* تقليل حجم قائمة الأوقات قليلاً */
  .item{ font-size: clamp(20px, 2.35vw, 44px); padding: calc(var(--s)*0.12) 0 calc(var(--s)*0.16); }

  /* تقليل ارتفاع شريط الآية والتكرار */
  .verseBar{ height: calc(var(--s)*2.2); }
  .ticker{ height: calc(var(--s)*1.85); }

  /* سطر رمضان (إن كان ظاهرًا) أقل ارتفاعًا */
  .ramadanLine{ padding: 10px 12px; margin-top: calc(var(--s)*0.22); font-size: calc(var(--s)*0.92); }
}
  </style>
</head>

<body>
  <div class="frame">
    <div class="arab-border right"></div>
    <div class="arab-border left"></div>

    <div class="board">

      <!-- ✅ طبقة صور الخلفية (فعاليات) -->
      <div class="eventsLayer" id="eventsLayer" aria-hidden="true">
        <img id="eventImgA" alt="" />
        <img id="eventImgB" alt="" />
        <div class="eventsOverlay"></div>
      </div>

      <div class="grain"></div>

      <div class="content">
        <div class="topbar">
          <div class="right">
            <div class="logo"><img id="logoImg" src="logo.png" alt="logo"></div>
            <div id="titleText">توقيت الأذان في مدرسة الغزالي</div>
          </div>
          <div class="left" id="locText">باقة الغربية</div>
        </div>

        <div class="clock">
          <div class="t" id="clockText">00:00:00</div>
        </div>

        <div class="meta">
          <div class="row1">
            <div id="dowText">—</div>
            <div id="monthText">—</div>
          </div>
          <div class="row2" id="gregText">—</div>
          <div class="row2" id="hijriText" style="margin-top:8px;">—</div>

          <div class="weather-row" id="weatherWrap" style="display:none">
            <span id="wIcon" class="w-icon">⛅</span>
            <span id="wTemp" class="w-temp">--°C</span>
            <span id="wDesc" class="w-desc">--</span>
          </div>
		  <div class="forecast-3" id="forecast3" style="display:none" aria-label="توقعات 3 أيام"></div>

        <div class="times" aria-label="أوقات الأذان">
          <div class="item" data-key="Fajr">
            <span class="name"><span class="icon">🌌</span> الفجر</span>
            <span class="val" id="fajr">--:--</span>
          </div>

          <div class="item" data-key="Sunrise">
            <span class="name"><span class="icon">🌅</span> الشروق</span>
            <span class="val" id="sunrise">--:--</span>

          <div class="item" data-key="Dhuhr">
            <span class="name"><span class="icon">☀️</span> الظهر</span>
            <span class="val" id="dhuhr">--:--</span>

          <div class="item" data-key="Asr">
            <span class="name"><span class="icon">🌤️</span> العصر</span>
            <span class="val" id="asr">--:--</span>

          <div class="item" data-key="Maghrib">
            <span class="name"><span class="icon">🌇</span> المغرب</span>

          <div class="item" data-key="Isha">
            <span class="name"><span class="icon">🌙</span> العشاء</span>
            <span class="val" id="isha">--:--</span>

        <div class="countdown" id="countdownText">⏳ الوقت المتبقي للأذان القادم: —</div>

        <div class="verseWrap">
          <div class="verseLabel" id="verseLabel">📖 آية</div>
          <div class="verseBar">
            <div class="verseTrack" id="verseTrack">—</div>
          </div>
        </div>

        <div class="ramadanLine" id="ramadanLine">
          🌙 رمضان مبارك.. وتذكروا أن الدين هو الأخلاق وحُسن المعاملة
        </div>

        <div class="tickerWrap">
          <div class="ticker">
            <div class="track" id="tickerTrack">—</div>
          </div>
        </div>

        <div class="alert" id="alertBar" style="display:none"></div>

        <!-- ✅ صندوق التهنئة -->
        <div class="birthday" id="birthdayBox"></div>
      </div>
    </div>
  </div>

<script>
  const CONFIG = {
    label: "باقة الغربية",
    lat: 32.4169,
    lon: 35.0405,
    tz: "Asia/Jerusalem",

    // ✅ فرق المدينة الثابت
    cityOffsetMinutes: 1,

    offsets: { Fajr: 0, Dhuhr: 0, Asr: 0, Maghrib: 0, Isha: 0, Sunrise: 0 },

    dehriFile: "dehri.json",

    driftCheckHours: 5,
    driftApiUrl: "https://worldtimeapi.org/api/timezone/Asia/Jerusalem",

    preAlertMinutes: { Fajr: 10, Dhuhr: 10, Asr: 10, Maghrib: 10, Isha: 10 },
    beep: true,

    // ✅ التهنئة (سحب من السيرفر)
    birthdaysFile: "birthdays.csv",
    birthdayEveryMinutes: 5,

    versesFile: "verses.json",
    versesRamadanFile: "verses_ramadan.json",
    verseChangeMinutes: 5,
    verseSpeedSeconds: 40,

    tickerMessages: [
      "🌟 يومكم جميل مثلكم يا أبطال الغزالي",
      "📚 تذكير: نعتني بكتبنا",
      "✅ سلوك اليوم: نحترم دور غيرنا",
      "🧼 نغسل أيدينا باستمرار",
      "🤝 معًا نصنع يومًا جميلًا",
      "😊 الابتسامة صدقة"
    ],

    tickerMessagesRamadan: [
      "🌙 رمضان كريم: لسان طيب.. وقلب طيب",
      "🤲 تقبّل الله طاعتكم",
      "🕌 في رمضان: نحافظ على الهدوء احترامًا للصائمين",
      "💛 صدقة بسيطة تصنع فرقًا",
      "📖 كل يوم آية.. وكل آية نور"
    ],

    tickerSpeedSeconds: 28,
    preAlertWindowSeconds: 20,
    alertShowSeconds: 12,

    /* ✅ صور الخلفية (مثل الملف القديم) */
    events: {
      enabled: true,
      basePath: "images/events/",
      ext: "jpg",
      count: 10,
      changeSeconds: 28,
      refreshMinutes: 5,
      hideBeforeMinutes: 2,
      hideAfterMinutes: 3,
      probeTimeoutMs: 4500
    },

    /* ✅ تحديث تلقائي يومي الساعة 07:00 */
    dailyHardRefreshAt: "07:00"
  };

  const $ = (id)=>document.getElementById(id);
  function pad(n){ return String(n).padStart(2,"0"); }
  function cleanHHMM(s){ return (s||"").replace(/[^\d:]/g,"").slice(0,5); }

  // =========================
  // ✅ انحراف الوقت (يُطبّق على العرض فقط)
  // =========================
  let DRIFT_MS = 0;
  const DRIFT_LS = "ghazali_time_drift_ms_v1";

  function loadDrift(){
    try{
      const v = Number(localStorage.getItem(DRIFT_LS) || "0");
      DRIFT_MS = Number.isFinite(v) ? v : 0;
    }catch{
      DRIFT_MS = 0;
    }
  }
  function saveDrift(){
    try{ localStorage.setItem(DRIFT_LS, String(DRIFT_MS)); }catch{}
  }
  function getNowCorrected(){
    return new Date(Date.now() + (DRIFT_MS || 0));
  }

  async function checkTimeDrift(){
    const controller = new AbortController();
    const t = setTimeout(()=>controller.abort(), 7000);

    try{
      const r = await fetch(CONFIG.driftApiUrl, { cache:"no-store", signal: controller.signal });
      if(!r.ok) throw new Error("drift fetch failed");
      const j = await r.json();
      const apiMs = Number(j.unixtime) * 1000;
      if(!Number.isFinite(apiMs) || apiMs <= 0) throw new Error("bad unixtime");

      const localMs = Date.now();
      const diff = apiMs - localMs;

      if(Math.abs(diff) <= 6 * 60 * 60 * 1000){
        DRIFT_MS = diff;
        saveDrift();
      }
    }catch(e){
      // keep last drift
    }finally{
      clearTimeout(t);
    }
  }

  // =========================
  // ✅ DST حسب القانون
  // =========================
  function lastSundayOfMonth(year, monthIndex){
    const d = new Date(year, monthIndex + 1, 0);
    const day = d.getDay();
    d.setDate(d.getDate() - day);
    return d;
  }

  function isIsraelDST_forDateInTZ(){
    const base = getNowCorrected();
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: CONFIG.tz,
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", second:"2-digit",
      hourCycle:"h23"
    }).formatToParts(base);

    const y  = Number(parts.find(p=>p.type==="year")?.value);
    const mo = Number(parts.find(p=>p.type==="month")?.value);
    const da = Number(parts.find(p=>p.type==="day")?.value);
    const hh = Number(parts.find(p=>p.type==="hour")?.value);
    const mm = Number(parts.find(p=>p.type==="minute")?.value);

    const current = new Date(y, mo-1, da, hh, mm, 0, 0);

    const lastSunMar = lastSundayOfMonth(y, 2);
    const start = new Date(lastSunMar.getFullYear(), lastSunMar.getMonth(), lastSunMar.getDate(), 2, 0, 0, 0);
    start.setDate(start.getDate() - 2);

    const lastSunOct = lastSundayOfMonth(y, 9);
    const end = new Date(lastSunOct.getFullYear(), lastSunOct.getMonth(), lastSunOct.getDate(), 2, 0, 0, 0);

    return (current >= start) && (current < end);
  }

  function getDstOffsetMinutes(){
    return isIsraelDST_forDateInTZ() ? 60 : 0;
  }

  // =========================
  // ✅ أدوات وقت/تاريخ في TZ
  // =========================
  function getZonedDateKey_MMDD(){
    const iso = new Intl.DateTimeFormat("en-CA", {
      year: "numeric", month: "2-digit", day: "2-digit", timeZone: CONFIG.tz
    }).format(getNowCorrected());
    const [y, m, d] = iso.split("-");
    return `${m}-${d}`;
  }

  function getZonedISODate(){
    return new Intl.DateTimeFormat("en-CA", {
      year: "numeric", month: "2-digit", day: "2-digit", timeZone: CONFIG.tz
    }).format(getNowCorrected());
  }

  function nowPartsTZ(){
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: CONFIG.tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"
    }).formatToParts(getNowCorrected());
    return {
      hh: parts.find(p=>p.type==="hour")?.value || "00",
      mm: parts.find(p=>p.type==="minute")?.value || "00",
      ss: parts.find(p=>p.type==="second")?.value || "00"
    };
  }

  function nowInTZ(){
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: CONFIG.tz,
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", second:"2-digit",
      hourCycle:"h23"
    }).formatToParts(getNowCorrected());

    const y  = Number(parts.find(p=>p.type==="year")?.value);
    const mo = Number(parts.find(p=>p.type==="month")?.value);
    const da = Number(parts.find(p=>p.type==="day")?.value);
    const hh = Number(parts.find(p=>p.type==="hour")?.value);
    const mm = Number(parts.find(p=>p.type==="minute")?.value);
    const ss = Number(parts.find(p=>p.type==="second")?.value);

    return new Date(y, mo-1, da, hh, mm, ss, 0);
  }

  // =========================
  // ✅ أسماء الشهور (كانون ثاني.. شباط..)
  // =========================
  const MONTHS_AR_LEVANT = {
    1:"كانون ثاني",
    2:"شباط",
    3:"آذار",
    4:"نيسان",
    5:"أيار",
    6:"حزيران",
    7:"تموز",
    8:"آب",
    9:"أيلول",
    10:"تشرين أول",
    11:"تشرين ثاني",
    12:"كانون أول"
  };

  function getMonthNumberTZ(d){
    const mStr = new Intl.DateTimeFormat("en-GB", { month:"2-digit", timeZone: CONFIG.tz }).format(d);
    const m = Number(mStr);
    return Number.isFinite(m) ? m : null;
  }

  function setClockAndDates(){
    const {hh,mm,ss} = nowPartsTZ();
    $("clockText").textContent = `${hh}:${mm}:${ss}`;

    const d = getNowCorrected();

    $("dowText").textContent = new Intl.DateTimeFormat("ar", { weekday:"long", timeZone: CONFIG.tz }).format(d);

    // ✅ الشهر بالعربي المشرقي بدل "يناير/فبراير..."
    const mNum = getMonthNumberTZ(d);
    $("monthText").textContent = (mNum && MONTHS_AR_LEVANT[mNum]) ? MONTHS_AR_LEVANT[mNum] : "—";

    const greg = new Intl.DateTimeFormat("en-CA", { year:"numeric", month:"2-digit", day:"2-digit", timeZone: CONFIG.tz }).format(d);
    $("gregText").textContent = greg;

    try{
      const hijri = new Intl.DateTimeFormat("ar", {
        day:"numeric", month:"long", year:"numeric",
        calendar:"islamic-umalqura",
        timeZone: CONFIG.tz
      }).format(d);
      $("hijriText").textContent = hijri;
    }catch{
      $("hijriText").textContent = "—";
    }
  }

  function addMinutesToHHMM(hhmm, addMin){
    const clean = cleanHHMM(hhmm);
    const parts = clean.split(":");
    const h = Number(parts[0]);
    const m = Number(parts[1]);
    if(!Number.isFinite(h) || !Number.isFinite(m)) return "--:--";

    let total = (h*60 + m) + (addMin||0);
    total = ((total % (24*60)) + (24*60)) % (24*60);

    const hh = Math.floor(total / 60);
    const mm = total % 60;
    return `${pad(hh)}:${pad(mm)}`;
  }

  // =========================
  // ✅ تحميل الدهري من dehri.json + كاش
  // =========================
  const DEHRI_LS = "ghazali_dehri_cache_v1";
  function saveDehriCache(payload){ try{ localStorage.setItem(DEHRI_LS, JSON.stringify(payload)); }catch{} }
  function readDehriCache(){ try{ return JSON.parse(localStorage.getItem(DEHRI_LS)||"null"); }catch{ return null; } }

  let dehriMap = null;
  let timingsAdj = null;
  let IS_RAMADAN = false;

  const ORDER = ["Fajr","Dhuhr","Asr","Maghrib","Isha"];
  const NAME_AR = {Fajr:"الفجر",Sunrise:"الشروق",Dhuhr:"الظهر",Asr:"العصر",Maghrib:"المغرب",Isha:"العشاء"};

  async function loadDehriMap(){
    try{
      const r = await fetch(CONFIG.dehriFile, { cache:"no-store" });
      if(!r.ok) throw new Error("Cannot load dehri");
      const j = await r.json();
      if(!j || typeof j !== "object") throw new Error("Bad dehri json");
      dehriMap = j;
      saveDehriCache({ data: j, updatedAt: Date.now() });
      return true;
    }catch{
      const cached = readDehriCache();
      if(cached && cached.data){
        dehriMap = cached.data;
        return true;
      }
      dehriMap = null;
      return false;
    }
  }

  function getHijriMonthNumber(){
    try{
      const d = getNowCorrected();
      const parts = new Intl.DateTimeFormat("en", {
        calendar:"islamic-umalqura",
        timeZone: CONFIG.tz,
        year:"numeric", month:"numeric", day:"numeric"
      }).formatToParts(d);
      const m = Number(parts.find(p=>p.type==="month")?.value);
      return Number.isFinite(m) ? m : null;
    }catch{
      return null;
    }
  }

  function setTickerText(msg){
    $("tickerTrack").textContent = `• ${msg} • ${msg} • ${msg}`;
  }

  let tickerIndex = 0;
  let TICKER_LIST = CONFIG.tickerMessages;

  function setTickerMode(isRamadan){
    const nextList = isRamadan ? (CONFIG.tickerMessagesRamadan || CONFIG.tickerMessages) : CONFIG.tickerMessages;
    if(TICKER_LIST === nextList) return;
    TICKER_LIST = nextList;
    tickerIndex = 0;
    setTickerText(TICKER_LIST[tickerIndex % TICKER_LIST.length]);
  }

  function startTicker(){
    document.documentElement.style.setProperty("--tickerSpeed", `${CONFIG.tickerSpeedSeconds}s`);
    setTickerText(TICKER_LIST[tickerIndex % TICKER_LIST.length]);
    const intervalMs = Math.max(8000, (CONFIG.tickerSpeedSeconds * 1000) - 1000);
    setInterval(()=>{
      tickerIndex++;
      setTickerText(TICKER_LIST[tickerIndex % TICKER_LIST.length]);
    }, intervalMs);
  }

  function applyRamadanMode(isOn){
    IS_RAMADAN = !!isOn;
    document.body.setAttribute("data-ramadan", IS_RAMADAN ? "1" : "0");
    $("verseLabel").textContent = IS_RAMADAN ? "📖 آية رمضانية" : "📖 آية";
    $("titleText").textContent = IS_RAMADAN ? "توقيت الأذان في مدرسة الغزالي 🌙" : "توقيت الأذان في مدرسة الغزالي";
    setTickerMode(IS_RAMADAN);
    loadVersesForMode();
  }

  function applyDehriForToday(){
    if(!dehriMap) return;

    const hijriMonth = getHijriMonthNumber();
    applyRamadanMode(hijriMonth === 9);

    const key = getZonedDateKey_MMDD();
    const row = dehriMap[key];
    if(!row) return;

    const baseOffset = (CONFIG.cityOffsetMinutes || 0) + getDstOffsetMinutes();

    const tFajr    = row.Fajr    || row.fajr    || row.FAJR;
    const tSunrise = row.Sunrise || row.sunrise || row.SHRQ || row.Sun;
    const tDhuhr   = row.Dhuhr   || row.dhuhr   || row.DHUHR;
    const tAsr     = row.Asr     || row.asr     || row.ASR;
    const tMaghrib = row.Maghrib || row.maghrib || row.MAGHRIB;
    const tIsha    = row.Isha    || row.isha    || row.ISHA;

    timingsAdj = {
      Fajr:    addMinutesToHHMM(tFajr,    baseOffset + (CONFIG.offsets.Fajr || 0)),
      Sunrise: addMinutesToHHMM(tSunrise, baseOffset + (CONFIG.offsets.Sunrise || 0)),
      Dhuhr:   addMinutesToHHMM(tDhuhr,   baseOffset + (CONFIG.offsets.Dhuhr || 0)),
      Asr:     addMinutesToHHMM(tAsr,     baseOffset + (CONFIG.offsets.Asr || 0)),
      Maghrib: addMinutesToHHMM(tMaghrib, baseOffset + (CONFIG.offsets.Maghrib || 0)),
      Isha:    addMinutesToHHMM(tIsha,    baseOffset + (CONFIG.offsets.Isha || 0))
    };

    $("fajr").textContent = timingsAdj.Fajr;
    $("sunrise").textContent = timingsAdj.Sunrise;
    $("dhuhr").textContent = timingsAdj.Dhuhr;
    $("asr").textContent = timingsAdj.Asr;
    $("maghrib").textContent = timingsAdj.Maghrib;
    $("isha").textContent = timingsAdj.Isha;

    updateNextHighlight();
    updateCountdown();
  }

  function parseTodayHHMM(hhmm){
    const clean = cleanHHMM(hhmm);
    const parts = clean.split(":");
    const h = Number(parts[0]);
    const m = Number(parts[1]);
    if(!Number.isFinite(h) || !Number.isFinite(m)) return null;

    const d = getNowCorrected();
    const y  = Number(new Intl.DateTimeFormat("en-CA",{year:"numeric",timeZone:CONFIG.tz}).format(d));
    const mo = Number(new Intl.DateTimeFormat("en-CA",{month:"2-digit",timeZone:CONFIG.tz}).format(d));
    const da = Number(new Intl.DateTimeFormat("en-CA",{day:"2-digit",timeZone:CONFIG.tz}).format(d));
    return new Date(y, mo-1, da, h, m, 0, 0);
  }

  function getNextPrayer(){
    if(!timingsAdj) return null;
    const now = nowInTZ();

    for(const k of ORDER){
      const at = parseTodayHHMM(timingsAdj[k]);
      if(!at) continue;
      if(at > now) return { key:k, at };
    }

    const atTomorrow = parseTodayHHMM(timingsAdj["Fajr"]);
    if(!atTomorrow) return null;
    atTomorrow.setDate(atTomorrow.getDate() + 1);
    return { key:"Fajr", at: atTomorrow };
  }

  function updateNextHighlight(){
    const next = getNextPrayer();
    const items = document.querySelectorAll(".times .item");
    items.forEach(it=>{
      it.classList.remove("next");
      const badge = it.querySelector(".badge-next");
      if(badge) badge.remove();
    });
    if(!next) return;

    const el = document.querySelector(`.times .item[data-key="${next.key}"]`);
    if(!el) return;

    el.classList.add("next");
    const badge = document.createElement("span");
    badge.className = "badge-next";
    badge.innerHTML = `<span class="badge-dot"></span> التالي`;
    el.querySelector(".name").appendChild(badge);
  }

  function formatRemainingTime(sec){
    if(sec < 0) return "";
    if(sec < 60) return "أقل من دقيقة";
    const hours = Math.floor(sec / 3600);
    const minutes = Math.floor((sec % 3600) / 60);
    if(hours > 0) return `${hours} ساعات و${minutes} دقائق`;
    return `${minutes} دقائق`;
  }

  function updateCountdown(){
    if(!timingsAdj) return;
    const now = nowInTZ();
    const next = getNextPrayer();
    if(!next) return;

    const secLeft = Math.floor((next.at - now) / 1000);
    if(secLeft < 0) return;

    const nameAr = NAME_AR[next.key] || next.key;
    $("countdownText").textContent =
      `⏳ الوقت المتبقي للأذان القادم (${nameAr}): ${formatRemainingTime(secLeft)}`;
  }

  // =========================
  // Verses
  // =========================
  const VERSE_LS = "ghazali_verse_index_v1";
  let verseRefs = [];
  let verseTimer = null;

  async function loadVersesRefs(path){
    const r = await fetch(path, { cache: "no-store" });
    if(!r.ok) throw new Error("Cannot load verses file");
    return await r.json();
  }

  function getVerseIndex(){
    const raw = localStorage.getItem(VERSE_LS);
    const idx = Number(raw || 0);
    return Number.isFinite(idx) && idx >= 0 ? idx : 0;
  }
  function setVerseIndex(idx){
    try{ localStorage.setItem(VERSE_LS, String(idx)); }catch{}
  }

  async function fetchVerseText(surah, ayah){
    const url = `https://api.alquran.cloud/v1/ayah/${surah}:${ayah}/ar`;
    const r = await fetch(url, { cache: "no-store" });
    if(!r.ok) throw new Error("Verse fetch failed");
    const j = await r.json();
    return j?.data?.text || "";
  }

  function setVerseTrackText(text){
    $("verseTrack").textContent = `• ${text} • ${text}`;
  }

  async function showVerseAt(index){
    if(!verseRefs.length) { setVerseTrackText("—"); return; }
    const idx = index % verseRefs.length;
    const ref = verseRefs[idx];
    try{
      const text = await fetchVerseText(ref.surah, ref.ayah);
      setVerseTrackText(text || "—");
    }catch{
      setVerseTrackText("—");
    }
    setVerseIndex(idx);
  }

  function startVerseLoop(){
    document.documentElement.style.setProperty("--verseSpeed", `${CONFIG.verseSpeedSeconds}s`);
    if(verseTimer) { clearInterval(verseTimer); verseTimer = null; }
    const idx = getVerseIndex();
    showVerseAt(idx);
    verseTimer = setInterval(async ()=>{
      const cur = getVerseIndex();
      await showVerseAt(cur + 1);
    }, CONFIG.verseChangeMinutes * 60 * 1000);
  }

  async function loadVersesForMode(){
    try{
      const primary = IS_RAMADAN ? CONFIG.versesRamadanFile : CONFIG.versesFile;
      let list = null;
      try{ list = await loadVersesRefs(primary); }
      catch{ list = await loadVersesRefs(CONFIG.versesFile); }
      verseRefs = Array.isArray(list) ? list : [];
      startVerseLoop();
    }catch{
      verseRefs = [];
      $("verseTrack").textContent = "—";
    }
  }

  // =========================
  // Weather
  // =========================
  function wmoToText(code){
    if(code === 0) return { t:"مشمس وصافٍ", i:"☀️" };
    if(code >= 1 && code <= 3) return { t:"غائم جزئيًا", i:"⛅" };
    if(code >= 45 && code <= 48) return { t:"ضبابي", i:"🌫️" };
    if(code >= 51 && code <= 55) return { t:"رذاذ خفيف", i:"🌦️" };
    if(code >= 61 && code <= 67) return { t:"ماطر", i:"🌧️" };
    if(code >= 71 && code <= 77) return { t:"مثلج", i:"🌨️" };
    if(code >= 80 && code <= 82) return { t:"زخات مطر", i:"🌦️" };
    if(code >= 95) return { t:"عاصف وماطر", i:"⛈️" };
    return { t:"صافٍ", i:"☀️" };
  }

  async function fetchWeather(){
   try{
     const url =
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
      `&current_weather=true` +
      `&daily=weathercode,temperature_2m_max,temperature_2m_min` +
      `&forecast_days=3` +
      `&timezone=${encodeURIComponent(CONFIG.tz)}`;

    const r = await fetch(url, { cache:"no-store" });
    const j = await r.json();

    // ✅ طقس الآن
    if(j.current_weather){
      const {temperature, weathercode} = j.current_weather;
      const info = wmoToText(weathercode);
      $("wIcon").textContent = info.i;
      $("wTemp").textContent = `${Math.round(temperature)}°C`;
      $("wDesc").textContent = info.t;
      $("weatherWrap").style.display = "flex";
    }else{
      $("weatherWrap").style.display = "none";
    }

    // ✅ توقعات 3 أيام: اليوم / غدًا / بعد غد
    if(j.daily && Array.isArray(j.daily.time) && j.daily.time.length >= 1){
      const times = j.daily.time;
      const wcodes = j.daily.weathercode || [];
      const tmax = j.daily.temperature_2m_max || [];
      const tmin = j.daily.temperature_2m_min || [];

      const labels = ["اليوم", "غدًا", "بعد غد"];

      let html = `<div class="grid">`;

      for(let i=0; i<Math.min(3, times.length); i++){
        const di = wmoToText(Number(wcodes[i]));
        const mx = Number.isFinite(Number(tmax[i])) ? Math.round(tmax[i]) : "--";
        const mn = Number.isFinite(Number(tmin[i])) ? Math.round(tmin[i]) : "--";

        html += `
          <div class="card">
            <div class="lbl">${labels[i] || ""}</div>
            <div class="ico">${di.i}</div>
            <div class="temps">${mn}° / ${mx}°</div>
          </div>
        `;
      }

      html += `</div>`;

      $("forecast3").innerHTML = html;
      $("forecast3").style.display = "block";
    }else{
      $("forecast3").style.display = "none";
    }

  }catch(e){
    $("weatherWrap").style.display = "none";
    $("forecast3").style.display = "none";
  }
}

  async function refreshDehriTimes(){
    if(!dehriMap){
      const ok = await loadDehriMap();
      if(!ok) return;
    }
    applyDehriForToday();
  }

  // =========================
  // ✅ نظام التهنئة (Birthdays)
  // =========================
  let birthdayList = [];
  let todaysBirthdays = [];
  let birthdayCursor = 0;

  const BDAY_SHOW_MS = 12000;
  const BDAY_GAP_MS  = 3000;

  async function loadBirthdaysCSV(path){
	const r = await fetch(path + "?v=" + Date.now());
	if(!r.ok) throw new Error("Cannot load birthdays.csv");
	
	let text = await r.text();
	
	// إزالة BOM إن وجد
	if(text.charCodeAt(0) === 0xFEFF){
	  text = text.slice(1);
	}	
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    if(lines.length < 2) return [];
    const headers = lines.shift().split(",").map(h=>h.trim().toLowerCase());
    const idx = (h)=>headers.indexOf(h);

    const out = [];
    for(const line of lines){
      const parts = line.split(",").map(x=>x.trim());
      const name = parts[idx("name")] || "";
      const role = parts[idx("role")] || "";
      const cls  = parts[idx("class")] || "";
      const day  = Number(parts[idx("day")] || 0);
      const month= Number(parts[idx("month")] || 0);
      if(name && day && month) out.push({name, role, cls, day, month});
    }
    return out;
  }

  function getTodayDM_TZ(){
    const d = getNowCorrected();
    const day = Number(new Intl.DateTimeFormat("en-GB",{day:"2-digit",timeZone:CONFIG.tz}).format(d));
    const month = Number(new Intl.DateTimeFormat("en-GB",{month:"2-digit",timeZone:CONFIG.tz}).format(d));
    return {day, month};
  }

  function refreshTodaysBirthdays(){
    const {day, month} = getTodayDM_TZ();
    todaysBirthdays = birthdayList.filter(b => b.day === day && b.month === month);
    if(todaysBirthdays.length) birthdayCursor = birthdayCursor % todaysBirthdays.length;
  }

  function showBirthdayCard(person){
    const box = $("birthdayBox");
    if(!box) return;

    const role = String(person.role || "").trim();
    const cls  = String(person.cls  || "").trim();
    const isTeacher = role.includes("معلم") || role.includes("معلمة") || role.includes("معلّم");

    box.innerHTML = `
      <div>🎉 عيد ميلاد سعيد</div>
      <div style="margin:14px 0; font-size:1.25em; color:#7b542a;">
        <strong>${person.name}</strong>
        ${cls ? `<div style="margin-top:6px; font-size:.75em; color:#2a1b06; opacity:.95;">${cls}</div>` : ""}
      </div>
      <div class="sub">
        ${isTeacher ? "🌷 شكرًا لعطائك اليومي" : "🌟 أسرة مدرسة الغزالي تتمنى لك عامًا جميلًا"}
      </div>
    `;
    box.style.display = "block";
    setTimeout(()=> box.style.display="none", BDAY_SHOW_MS);
  }

  function runBirthdaySequence(){
    if(!todaysBirthdays.length) return;

    const count = todaysBirthdays.length;
    const step = BDAY_SHOW_MS + BDAY_GAP_MS;
    const startIndex = birthdayCursor;

    for(let i=0; i<count; i++){
      const person = todaysBirthdays[(startIndex + i) % count];
      setTimeout(()=>{ showBirthdayCard(person); }, i * step);
    }

    birthdayCursor = (startIndex + count) % count;
  }

  function startBirthdayLoop(){
    refreshTodaysBirthdays();
    if(!todaysBirthdays.length) return;

    // أول عرض بعد دقيقتين
    setTimeout(()=>{
      refreshTodaysBirthdays();
      runBirthdaySequence();
    }, 2 * 60 * 1000);

    // ثم كل X دقائق
    setInterval(()=>{
      refreshTodaysBirthdays();
      runBirthdaySequence();
    }, (CONFIG.birthdayEveryMinutes || 5) * 60 * 1000);
  }

  // =========================
  // ✅ صور الخلفية (Events)
  // =========================
  const eventsState = {
    valid: [],
    idx: 0,
    ready: false,
    cacheBust: Date.now(),
    tickHandle: null,
    showingA: true
  };

  function eventsUrl(n){
    return `${CONFIG.events.basePath}${n}.${CONFIG.events.ext}?v=${eventsState.cacheBust}`;
  }

  function probeImage(url, timeoutMs){
    return new Promise((resolve)=>{
      const img = new Image();
      let done = false;

      const t = setTimeout(()=>{
        if(done) return;
        done = true;
        try{ img.src = ""; }catch{}
        resolve(false);
      }, timeoutMs || 4500);

      img.onload = ()=>{
        if(done) return;
        done = true;
        clearTimeout(t);
        resolve(true);
      };
      img.onerror = ()=>{
        if(done) return;
        done = true;
        clearTimeout(t);
        resolve(false);
      };

      img.src = url;
    });
  }

  async function refreshEventsList(){
    if(!CONFIG.events?.enabled) return;
    eventsState.cacheBust = Date.now();
    const found = [];
    for(let i=1; i<=CONFIG.events.count; i++){
      const ok = await probeImage(eventsUrl(i), CONFIG.events.probeTimeoutMs);
      if(ok) found.push(i);
    }
    eventsState.valid = found;
    eventsState.idx = 0;
    eventsState.ready = true;

    if(!found.length){
      setEventsLayerVisible(false);
    }
  }

  function shouldShowEventsNow(){
    if(!CONFIG.events?.enabled) return false;
    if(!eventsState.ready) return false;
    if(!eventsState.valid.length) return false;
    if(!timingsAdj) return false;

    const next = getNextPrayer();
    if(!next) return false;

    const now = nowInTZ();
    const msToNext = next.at - now;

    const hideBeforeMs = (CONFIG.events.hideBeforeMinutes || 2) * 60 * 1000;
    if(msToNext <= hideBeforeMs) return false;

    const hideAfterMs = (CONFIG.events.hideAfterMinutes || 3) * 60 * 1000;
    for(const k of ORDER){
      const at = parseTodayHHMM(timingsAdj[k]);
      if(!at) continue;
      const diff = now - at;
      if(diff >= 0 && diff <= hideAfterMs){
        return false;
      }
    }

    return true;
  }

  function setEventsLayerVisible(on){
    const layer = $("eventsLayer");
    if(!layer) return;
    layer.style.opacity = on ? "1" : "0";
  }

  function renderEventImage(n){
    const a = $("eventImgA");
    const b = $("eventImgB");
    if(!a || !b) return;

    const url = eventsUrl(n);

    const showA = eventsState.showingA;
    const front = showA ? a : b;
    const back  = showA ? b : a;

    back.classList.remove("show");
    back.src = url;

    setTimeout(()=>{
      back.classList.add("show");
      front.classList.remove("show");
      eventsState.showingA = !eventsState.showingA;
    }, 60);
  }

  function advanceEvents(){
    if(!shouldShowEventsNow()){
      setEventsLayerVisible(false);
      return;
    }

    setEventsLayerVisible(true);
    if(!eventsState.valid.length) return;

    const n = eventsState.valid[eventsState.idx % eventsState.valid.length];
    eventsState.idx = (eventsState.idx + 1) % eventsState.valid.length;

    renderEventImage(n);
  }

  function startEventsLoop(){
    if(!CONFIG.events?.enabled) return;

    refreshEventsList().then(()=>{
      advanceEvents();

      if(eventsState.tickHandle) clearInterval(eventsState.tickHandle);
      eventsState.tickHandle = setInterval(()=>{
        advanceEvents();
      }, (CONFIG.events.changeSeconds || 28) * 1000);
    }).catch(()=>{});
  }

  function scheduleEventsRefresh(){
    if(!CONFIG.events?.enabled) return;
    setInterval(()=>{
      refreshEventsList().then(()=> advanceEvents()).catch(()=>{});
    }, (CONFIG.events.refreshMinutes || 5) * 60 * 1000);
  }

  function updateEventsVisibility(){
    if(!CONFIG.events?.enabled) return;
    setEventsLayerVisible(shouldShowEventsNow());
  }

  // =========================
  // ✅ تحديث يومي 07:00 (كسر كاش)
  // =========================
  const DAILY_REFRESH_LS = "ghazali_daily_refresh_done_v1";

  function getDateKeyTZ(){
    // YYYY-MM-DD
    return getZonedISODate();
  }

  function getTimeHHMM_TZ(){
    const d = getNowCorrected();
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: CONFIG.tz,
      hour:"2-digit", minute:"2-digit",
      hourCycle:"h23"
    }).formatToParts(d);
    const hh = parts.find(p=>p.type==="hour")?.value || "00";
    const mm = parts.find(p=>p.type==="minute")?.value || "00";
    return `${hh}:${mm}`;
  }

  function hardReloadWithCacheBust(){
  const url = new URL(window.location.href);
  url.searchParams.set("v", Date.now().toString());
  window.location.replace(url.toString());
}

  function dailyRefreshSchedulerTick(){
  const target = CONFIG.dailyHardRefreshAt || "07:35";
  const todayKey = getDateKeyTZ();
  const doneKey = localStorage.getItem(DAILY_REFRESH_LS);
  if(doneKey === todayKey) return;

  // حوّل الوقت الحالي والهدف لدقائق
  const [th, tm] = target.split(":").map(Number);
  const [nh, nm] = getTimeHHMM_TZ().split(":").map(Number);
  const targetMin = th*60 + tm;
  const nowMin = nh*60 + nm;

  // إذا وصلنا/تجاوزنا 07:00 نفّذ مرة واحدة فقط لليوم
  if(nowMin >= targetMin){
    try{ localStorage.setItem(DAILY_REFRESH_LS, todayKey); }catch{}
    hardReloadWithCacheBust();
  }
}

  // =========================
  // INIT
  // =========================
  const logo = $("logoImg");
  logo.onerror = ()=>{ logo.style.display="none"; };
  $("locText").textContent = CONFIG.label;

  loadDrift();
  startTicker();
  setClockAndDates();

  checkTimeDrift();
  setInterval(()=>checkTimeDrift(), CONFIG.driftCheckHours * 60 * 60 * 1000);

  refreshDehriTimes();

  fetchWeather();
  loadVersesForMode();

  // تحميل التهاني من السيرفر
  loadBirthdaysCSV(CONFIG.birthdaysFile)
    .then(l=>{ birthdayList = Array.isArray(l) ? l : []; startBirthdayLoop(); })
    .catch(()=>{});

  // صور الخلفية
  startEventsLoop();
  scheduleEventsRefresh();

  setInterval(()=>{
    setClockAndDates();
    updateNextHighlight();
    updateCountdown();
    updateEventsVisibility();
    dailyRefreshSchedulerTick();
  }, 1000);

  setInterval(()=>fetchWeather(), 30 * 60 * 1000);

  setInterval(()=>applyDehriForToday(), 15 * 60 * 1000);

  let lastDayStr = getZonedISODate();
  setInterval(()=>{
    const currentDayStr = getZonedISODate();
    if(currentDayStr !== lastDayStr){
      lastDayStr = currentDayStr;
      applyDehriForToday();
      loadVersesForMode();
      refreshEventsList().then(()=> advanceEvents()).catch(()=>{});
      refreshTodaysBirthdays();
    }
  }, 60000);
</script>
</body>
</html>
