<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>توقيت مدرسة الغزالي باقة الغربية</title>

  <style>
    :root{
      --bg:#ffffff;
      --ink:#0b0b0b;
      --muted:#666;
      --line:#d7d7d7;

      --green:#0aa85a;
      --blue:#1177d6;
      --red:#d82121;
      --black:#111;

      /* تكبير تلقائي حسب الشاشة */
      --s: clamp(14px, 1.6vw, 28px);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif;
      height:100vh;
      width:100vw;
      overflow:hidden;
    }

    /* لوحة ملء الشاشة */
    .screen{
      height:100vh;
      width:100vw;
      display:flex;
      align-items:stretch;
      justify-content:center;
    }

    .board{
      width:min(1100px, 100vw);
      height:100vh;
      padding: calc(var(--s) * 0.9) calc(var(--s) * 0.9);
      display:flex;
      flex-direction:column;
      gap: calc(var(--s) * 0.7);
    }

    /* رأس خفيف مثل الصورة */
    .topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      font-size: calc(var(--s) * 0.9);
      color:var(--muted);
      font-weight:700;
    }

    .logoWrap{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 180px;
    }
    .logo{
      width: calc(var(--s) * 2.1);
      height: calc(var(--s) * 2.1);
      border:1px solid var(--line);
      border-radius: 10px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fafafa;
      flex:0 0 auto;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .brand{
      display:flex;
      flex-direction:column;
      line-height:1.15;
    }
    .brand .t{ font-weight:900; color:#111; font-size: calc(var(--s) * 1.0); }
    .brand .s{ font-weight:800; color:var(--muted); font-size: calc(var(--s) * 0.82); }

    /* الساعة الكبيرة */
    .clock{
      display:flex;
      align-items:baseline;
      justify-content:center;
      gap: calc(var(--s) * 0.35);
      font-weight:1000;
      letter-spacing: 1px;
      margin-top: calc(var(--s) * 0.2);
    }
    .clock .hhmm{
      font-size: clamp(72px, 10vw, 140px);
      line-height:1;
    }
    .clock .ss{
      font-size: clamp(26px, 4vw, 56px);
      line-height:1;
      color:#222;
      min-width: 3ch;
      text-align:left;
    }

    .dates{
      text-align:center;
      font-weight:1000;
      font-size: clamp(22px, 3.2vw, 44px);
      line-height:1.15;
    }
    .dates .dow{ font-weight:1000; }
    .dates .hijri{ margin-top: calc(var(--s)*0.25); font-weight:1000; }
    .dates .greg{
      margin-top: calc(var(--s)*0.22);
      font-size: calc(var(--s)*0.95);
      font-weight:900;
      color:var(--muted);
    }

    /* جدول */
    .table{
      border-top: 2px solid var(--line);
      padding-top: calc(var(--s) * 0.7);
      display:flex;
      flex-direction:column;
      gap: calc(var(--s) * 0.55);
      flex:1 1 auto;
    }

    .tableHeader{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      font-weight:1000;
      font-size: clamp(18px, 2.6vw, 36px);
      color:#111;
    }
    .tableHeader .right{ text-align:right; }
    .tableHeader .center{ text-align:center; }
    .tableHeader .left{ text-align:left; }

    .row{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap: calc(var(--s) * 0.6);
      padding: calc(var(--s) * 0.35) 0;
      border-bottom: 1px solid rgba(0,0,0,.07);
    }

    .time{
      font-weight:1100;
      font-variant-numeric: tabular-nums;
      font-size: clamp(26px, 4.6vw, 62px);
      line-height:1;
      white-space:nowrap;
    }
    .time.adhan{ text-align:right; }
    .time.iqama{ text-align:left; }

    /* “بطاقة” اسم الصلاة */
    .prayerTag{
      min-width: clamp(150px, 22vw, 260px);
      text-align:center;
      font-weight:1000;
      font-size: clamp(18px, 2.8vw, 42px);
      color:#fff;
      padding: calc(var(--s) * 0.35) calc(var(--s) * 0.55);
      border-radius: 10px;
      background: var(--black);
      line-height:1.05;
    }

    /* ألوان مثل الصورة */
    .c-fajr{ color: var(--green); }
    .c-dhuhr{ color: var(--blue); }
    .c-asr{ color: var(--red); }
    .c-maghrib{ color: var(--green); }
    .c-isha{ color: var(--red); }
    .tag-fajr{ background: var(--black); }
    .tag-dhuhr{ background: #0f1b25; }
    .tag-asr{ background: #0f1b25; }
    .tag-maghrib{ background: #0f1b25; }
    .tag-isha{ background: #0f1b25; }

    /* شريط سفلي اختياري */
    .footer{
      border-top: 2px solid var(--line);
      padding-top: calc(var(--s) * 0.55);
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-weight:900;
      color:var(--muted);
      font-size: calc(var(--s) * 0.9);
      gap:10px;
    }
    .footer strong{ color:#111; }

    /* زر ملء الشاشة (مفيد للتلفزيون) */
    .fsBtn{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight:1000;
      cursor:pointer;
    }
    .fsBtn:active{ transform: translateY(1px); }

    @media (max-width: 520px){
      .logoWrap{ display:none; }
      .board{ padding: 12px; }
    }
  </style>
</head>

<body>
  <div class="screen">
    <div class="board">
      <div class="topline">
        <div class="logoWrap">
          <div class="logo"><img id="logoImg" src="logo.png" alt="logo"></div>
          <div class="brand">
            <div class="t">توقيت مدرسة الغزالي</div>
            <div class="s">باقـة الغربية</div>
          </div>
        </div>

        <div id="locText">باقـة الغربية - إسرائيل</div>

        <button class="fsBtn" id="fsBtn">📺 شاشة كاملة</button>
      </div>

      <div class="clock" aria-label="الساعة">
        <div class="hhmm" id="hhmm">00:00</div>
        <div class="ss" id="ss">00</div>
      </div>

      <div class="dates">
        <div class="dow" id="dow">—</div>
        <div class="hijri" id="hijri">—</div>
        <div class="greg" id="greg">—</div>
      </div>

      <div class="table">
        <div class="tableHeader">
          <div class="right">الأذان</div>
          <div class="center">الصلاة</div>
          <div class="left">الإقامة</div>
        </div>

        <div class="row">
          <div class="time adhan c-fajr" id="adhanFajr">--:--</div>
          <div class="prayerTag tag-fajr">الفجر</div>
          <div class="time iqama c-fajr" id="iqamaFajr">--:--</div>
        </div>

        <div class="row">
          <div class="time adhan c-dhuhr" id="adhanDhuhr">--:--</div>
          <div class="prayerTag tag-dhuhr">الظهر</div>
          <div class="time iqama c-dhuhr" id="iqamaDhuhr">--:--</div>
        </div>

        <div class="row">
          <div class="time adhan c-asr" id="adhanAsr">--:--</div>
          <div class="prayerTag tag-asr">العصر</div>
          <div class="time iqama c-asr" id="iqamaAsr">--:--</div>
        </div>

        <div class="row">
          <div class="time adhan c-maghrib" id="adhanMaghrib">--:--</div>
          <div class="prayerTag tag-maghrib">المغرب</div>
          <div class="time iqama c-maghrib" id="iqamaMaghrib">--:--</div>
        </div>

        <div class="row">
          <div class="time adhan c-isha" id="adhanIsha">--:--</div>
          <div class="prayerTag tag-isha">العشاء</div>
          <div class="time iqama c-isha" id="iqamaIsha">--:--</div>
        </div>
      </div>

      <div class="footer">
        <div>تحديث تلقائي حسب باقة الغربية</div>
        <div><strong>ملاحظة:</strong> يمكن ضبط فروقات الدقائق للمطابقة الدقيقة</div>
      </div>
    </div>
  </div>

<script>
  // ==========================
  // إعدادات باقة الغربية
  // ==========================
  const CONFIG = {
    tz: "Asia/Jerusalem",
    fixed: { lat: 32.4169, lon: 35.0405 },

    // طريقة الحساب (3 غالبًا مناسبة، يمكن تغييرها إذا لزم)
    method: 3,
    asrJuristic: "STANDARD", // أو "HANAFI"

    // فروقات محلية (حسب اللي قلتَه)
    offsets: {
      Fajr: 2,
      Dhuhr: 1,
      Asr: 3,
      Maghrib: 10,
      Isha: 0
    },

    // الإقامة: إن لم تكن عندك أوقات إقامة ثابتة، نخليها = الأذان + دقائق
    // غيّرها حسب مسجدكم إذا ترغب.
    iqamaAddMinutes: {
      Fajr: 30,
      Dhuhr: 10,
      Asr: 10,
      Maghrib: 5,
      Isha: 15
    }
  };

  const $ = (id)=>document.getElementById(id);

  function pad(n){ return String(n).padStart(2,"0"); }
  function cleanHHMM(s){ return (s||"").replace(/[^\d:]/g,"").slice(0,5); }

  function nowPartsTZ(){
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: CONFIG.tz,
      hour:"2-digit", minute:"2-digit", second:"2-digit",
      hourCycle:"h23"
    }).formatToParts(new Date());
    return {
      hh: parts.find(p=>p.type==="hour")?.value || "00",
      mm: parts.find(p=>p.type==="minute")?.value || "00",
      ss: parts.find(p=>p.type==="second")?.value || "00"
    };
  }

  function setClock(){
    const {hh,mm,ss} = nowPartsTZ();
    $("hhmm").textContent = `${hh}:${mm}`;
    $("ss").textContent = ss;

    const weekday = new Intl.DateTimeFormat("ar", { weekday:"long", timeZone: CONFIG.tz }).format(new Date());
    $("dow").textContent = weekday;

    const greg = new Intl.DateTimeFormat("ar", { day:"2-digit", month:"2-digit", year:"numeric", timeZone: CONFIG.tz }).format(new Date());
    $("greg").textContent = greg;
  }

  function addMinutesToHHMM(hhmm, addMin){
    const clean = cleanHHMM(hhmm);
    const [h,m] = clean.split(":").map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    d.setMinutes(d.getMinutes() + (addMin||0));
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function toDateKey(d){
    const day = pad(Number(new Intl.DateTimeFormat("en-GB",{timeZone:CONFIG.tz,day:"2-digit"}).format(d)));
    const month = pad(Number(new Intl.DateTimeFormat("en-GB",{timeZone:CONFIG.tz,month:"2-digit"}).format(d)));
    const year = new Intl.DateTimeFormat("en-GB",{timeZone:CONFIG.tz,year:"numeric"}).format(d);
    return `${day}-${month}-${year}`;
  }

  async function fetchTimings(){
    const dateKey = toDateKey(new Date());
    const url =
      `https://api.aladhan.com/v1/timings/${dateKey}` +
      `?latitude=${encodeURIComponent(CONFIG.fixed.lat)}` +
      `&longitude=${encodeURIComponent(CONFIG.fixed.lon)}` +
      `&method=${encodeURIComponent(CONFIG.method)}` +
      `&school=${CONFIG.asrJuristic==="HANAFI" ? 1 : 0}`;

    const r = await fetch(url);
    if(!r.ok) throw new Error("Fetch failed");
    const j = await r.json();
    if(j.code !== 200) throw new Error("Bad response");
    return j.data;
  }

  function setRow(prayerKey, adhanId, iqamaId){
    const adhanBase = cleanHHMM(window.__timings[prayerKey]);
    const adhanAdjusted = addMinutesToHHMM(adhanBase, CONFIG.offsets[prayerKey] || 0);
    $(adhanId).textContent = adhanAdjusted;

    const iq = addMinutesToHHMM(adhanAdjusted, CONFIG.iqamaAddMinutes[prayerKey] || 0);
    $(iqamaId).textContent = iq;
  }

  async function load(){
    // شعار اختياري
    const img = $("logoImg");
    img.onerror = ()=>{ img.style.display="none"; };

    const data = await fetchTimings();
    window.__timings = data.timings;

    // هجري
    const h = data.date?.hijri;
    if(h){
      const hijriText = `${h.year}-${pad(h.month?.number || 0)}-${pad(h.day)} هـ`;
      $("hijri").textContent = hijriText;
    }else{
      $("hijri").textContent = "—";
    }

    setRow("Fajr", "adhanFajr", "iqamaFajr");
    setRow("Dhuhr", "adhanDhuhr", "iqamaDhuhr");
    setRow("Asr", "adhanAsr", "iqamaAsr");
    setRow("Maghrib", "adhanMaghrib", "iqamaMaghrib");
    setRow("Isha", "adhanIsha", "iqamaIsha");
  }

  // زر شاشة كاملة
  $("fsBtn").addEventListener("click", ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.();
    }else{
      document.exitFullscreen?.();
    }
  });

  // تشغيل
  setClock();
  setInterval(setClock, 1000);
  load().catch(console.error);
  // إعادة تحميل المواقيت كل 6 ساعات
  setInterval(()=>load().catch(()=>{}), 6*60*60*1000);
</script>
</body>
</html>
