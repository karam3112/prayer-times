<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>توقيت الأذان في مدرسة الغزالي باقة الغربية</title>

  <style>
    @font-face{
      font-family: "HacenScreen";
      src: url("font/Hacen%20Liner%20Screen%20St%20Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root{
      --bg:#f6f2ea;
      --ink:#111;
      --muted:#4a4a4a;
      --top:#9a6a35;
      --top2:#7b542a;
      --red:#c91c1c;
      --green-bg: #e8f5e9;
      --green-border: #2e7d32;
      --green-text: #1b5e20;
      --line:#cbb9a3;
      --arab:#7a5a34;
      --s: clamp(16px, 2.15vw, 34px);
      --tickerSpeed: 28s;
      --verseSpeed: 40s;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      height:100vh;
      width:100vw;
      overflow:hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "HacenScreen", system-ui, Tahoma, Arial, sans-serif;
    }

    @keyframes antiBurn {
      0% { transform: translate(0, 0); }
      25% { transform: translate(2px, 1px); }
      50% { transform: translate(0, 2px); }
      75% { transform: translate(-2px, 1px); }
      100% { transform: translate(0, 0); }
    }

    .frame{
      height:100vh;
      width:100vw;
      position:relative;
      display:flex;
      align-items:stretch;
      justify-content:center;
      padding: clamp(10px, 1.8vw, 22px);
      background:
        linear-gradient(90deg, rgba(122,90,52,.18), rgba(122,90,52,0) 18%),
        linear-gradient(270deg, rgba(122,90,52,.18), rgba(122,90,52,0) 18%),
        var(--bg);
      animation: antiBurn 300s infinite alternate linear; 
    }

    .arab-border{
      position:absolute;
      top:0; bottom:0;
      width: clamp(22px, 3.2vw, 52px);
      opacity:.9;
      background-color: transparent;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='120' viewBox='0 0 40 120'><rect width='40' height='120' fill='none'/><path d='M8,0 C20,12 20,28 8,40 C-4,52 -4,68 8,80 C20,92 20,108 8,120' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/><path d='M32,0 C20,12 20,28 32,40 C44,52 44,68 32,80 C20,92 20,108 32,120' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/></svg>");
      background-repeat: repeat-y;
      background-size: 100% auto;
      filter: saturate(1.1);
      pointer-events:none;
    }
    .arab-border.right{ right:0; }
    .arab-border.left{ left:0; transform: scaleX(-1); }

    .board{
      width:min(1100px, 100%);
      height:100%;
      background: rgba(246,242,234,.90);
      border: 3px solid var(--line);
      box-shadow: 0 18px 70px rgba(0,0,0,.14);
      position:relative;
      display:flex;
      flex-direction:column;
      padding: clamp(12px, 2vw, 24px);
      border-radius: 16px;
      overflow:hidden;
      isolation:isolate;
    }

    .board::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:0;
      opacity:.28;
      background-repeat:no-repeat;
      background-size: 170px 170px;
      background-position: top 8px right 8px, top 8px left 8px, bottom 8px right 8px, bottom 8px left 8px;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><path d='M160 20c-35 0-60 25-60 60 0 10 2 19 6 27-8-4-17-6-27-6-35 0-60 25-60 60' fill='none' stroke='%237a5a34' stroke-width='8' stroke-linecap='round'/><path d='M160 20c-22 10-35 28-36 60' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/><circle cx='160' cy='20' r='6' fill='%237a5a34'/></svg>");
    }

    .grain{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      opacity:.06;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.35'/></svg>");
      background-size: 220px 220px;
      mix-blend-mode:multiply;
    }

    .content{
      position:relative;
      z-index:1;
      height:100%;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      background: linear-gradient(90deg, var(--top2), var(--top), var(--top2));
      color:#fff;
      border-radius: 12px;
      padding: calc(var(--s)*0.62) calc(var(--s)*0.8);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .topbar .right{
      display:flex; align-items:center;
      gap:12px;
      font-weight:1000;
      font-size: calc(var(--s)*1.05);
      line-height:1.1;
    }
    .logo{
      width: calc(var(--s)*2.1);
      height: calc(var(--s)*2.1);
      border-radius: 12px;
      overflow:hidden;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.35);
      flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .topbar .left{
      font-weight:1000;
      font-size: calc(var(--s)*0.90);
      opacity:.95;
      text-align:left;
      white-space:nowrap;
    }

    .clock{
      text-align:center;
      margin-top: calc(var(--s)*0.60);
      font-weight: 1000;
      letter-spacing: 1px;
      color:#111;
    }
    .clock .t{
      font-size: clamp(70px, 10vw, 140px);
      line-height:1;
    }

    .meta{
      text-align:center;
      margin-top: calc(var(--s)*0.25);
      font-weight: 1000;
      line-height:1.2;
    }
    .meta .row1{
      display:flex;
      justify-content:center;
      gap: calc(var(--s)*1.0);
      flex-wrap:wrap;
      font-size: clamp(20px, 2.8vw, 42px);
    }
    .meta .row2{
      margin-top: calc(var(--s)*0.15);
      font-size: clamp(16px, 2.1vw, 32px);
      color:#222;
    }

    /* تنسيق عداد رمضان الجديد */
    #ramadanCounter {
      margin-top: 15px;
      font-weight: 1000;
      font-size: clamp(18px, 2.5vw, 38px);
      min-height: 1.5em;
    }

    .weather-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      background-color: rgba(123, 84, 42, 0.08);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      padding: 6px 20px;
      border-radius: 50px;
      border: 1px solid rgba(123, 84, 42, 0.15);
      color: #7b542a;
      font-weight: 1000;
      font-size: clamp(16px, 2.0vw, 30px);
    }

    .times{
      margin-top: calc(var(--s)*0.55);
      display:flex;
      flex-direction:column;
      gap: calc(var(--s)*0.52);
      padding: calc(var(--s)*0.55) calc(var(--s)*0.65);
    }

    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom: 2px solid rgba(155,120,80,.25);
      padding: calc(var(--s)*0.18) 0 calc(var(--s)*0.25);
      font-size: clamp(24px, 3.2vw, 50px);
      font-weight:1000;
    }
    .item.next{
      background: var(--green-bg);
      border: 2px solid var(--green-border);
      border-radius: 16px;
      padding-inline: calc(var(--s)*0.6);
    }
    .item .val{ color: var(--red); }
    .item.next .val, .item.next .name { color: var(--green-text); }

    .countdown{
      margin-top: calc(var(--s)*0.55);
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(160, 210, 255, .22);
      border: 2px solid rgba(90,150,210,.35);
      text-align:center;
      font-weight:1000;
      font-size: calc(var(--s)*1.05);
    }

    .tickerWrap{
      margin-top:auto;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 12px;
      height: calc(var(--s)*2.4);
      display:flex;
      align-items:center;
      overflow:hidden;
    }
    .tickerTrack{
      display:inline-flex;
      align-items:center;
      gap: 34px;
      white-space:nowrap;
      padding-inline: 18px;
      font-weight:1000;
      font-size: calc(var(--s)*0.95);
      animation: tickerMove var(--tickerSpeed) linear infinite;
    }
    @keyframes tickerMove{ 0%{ transform: translateX(-10%); } 100%{ transform: translateX(110%); } }

    .verseWrap{
      margin-top: calc(var(--s)*0.45);
      display:flex;
      align-items:center;
      gap:12px;
      padding: 0 calc(var(--s)*0.65);
    }
    .verseLabel{ font-weight:1000; color:#7b542a; font-size: calc(var(--s)*0.88); white-space:nowrap; }
    .verseBar{
      flex: 1;
      overflow:hidden;
      border-radius: 12px;
      background: rgba(122,90,52,.08);
      border: 2px solid rgba(122,90,52,.18);
      height: calc(var(--s)*2.55);
      display:flex;
      align-items:center;
    }
    .verseTrack{
      display:inline-flex;
      align-items:center;
      white-space:nowrap;
      padding-inline: 22px;
      font-weight:1000;
      font-size: calc(var(--s)*0.92);
      color: #3e2723;
      animation: verseMove var(--verseSpeed) linear infinite !important;
    }
    @keyframes verseMove{ 0%{ transform: translateX(-5%); } 100%{ transform: translateX(105%); } }
  </style>
</head>
<body>

  <div class="frame">
    <div class="arab-border right"></div>
    <div class="arab-border left"></div>

    <div class="board">
      <div class="grain"></div>
      <div class="content">

        <div class="topbar">
          <div class="right">
            <div class="logo"><img src="logo.png" id="logoImg" alt="logo" /></div>
            <div id="locText">مدرسة الغزالي - باقة الغربية</div>
          </div>
          <div class="left">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
        </div>

        <div class="clock">
          <div class="t" id="mainClock">00:00:00</div>
        </div>

        <div class="meta">
          <div class="row1">
            <div id="dateG">—</div>
            <div id="dayName">—</div>
          </div>
          <div class="row2" id="hijriText">—</div>
          
          <div id="ramadanCounter"></div>
        </div>

        <div class="weather-row" id="weatherWrap" style="display:none">
          <span class="w-icon" id="wIcon"></span>
          <span class="w-temp" id="wTemp">—</span>
          <span class="w-desc" id="wDesc">—</span>
        </div>

        <div class="times">
          <div class="item" id="row-Fajr"><div class="name">الفجر</div><div class="val" id="time-Fajr">—</div></div>
          <div class="item" id="row-Sunrise"><div class="name">الشروق</div><div class="val" id="time-Sunrise">—</div></div>
          <div class="item" id="row-Dhuhr"><div class="name">الظهر</div><div class="val" id="time-Dhuhr">—</div></div>
          <div class="item" id="row-Asr"><div class="name">العصر</div><div class="val" id="time-Asr">—</div></div>
          <div class="item" id="row-Maghrib"><div class="name">المغرب</div><div class="val" id="time-Maghrib">—</div></div>
          <div class="item" id="row-Isha"><div class="name">العشاء</div><div class="val" id="time-Isha">—</div></div>
        </div>

        <div class="countdown" id="cdWrap" style="visibility:hidden">
          باقي على أذان <span id="cdName">—</span>: <span id="cdTimer">00:00:00</span>
        </div>

        <div class="verseWrap">
          <div class="verseLabel">آية اليوم:</div>
          <div class="verseBar"><div class="verseTrack" id="verseTrack">جاري التحميل...</div></div>
        </div>

        <div class="tickerWrap">
          <div class="tickerTrack" id="tickerTrack">أهلاً بكم في مدرسة الغزالي الإعدادية - باقة الغربية</div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-hijri/2.1.2/moment-hijri.min.js"></script>

  <script>
  const CONFIG = {
    label: "مدرسة الغزالي - باقة الغربية",
    city: "Baqat al-Gharbiya",
    country: "Israel",
    method: 3, 
    tz: "Asia/Jerusalem",
    verseSpeedSeconds: 40
  };

  const $ = (id)=>document.getElementById(id);

  // تحديث عداد رمضان
  function updateRamadanCountdown() {
    // تاريخ بداية رمضان 2026 المتوقع (19 فبراير)
    const ramadanDate = new Date(2026, 1, 19); 
    const now = new Date();
    
    // تصفير الوقت للمقارنة بالأيام فقط
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffTime = ramadanDate - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    const counterEl = $("ramadanCounter");

    if (diffDays > 0) {
      // منطق "يوم" و "أيام"
      let unit = (diffDays <= 10) ? "أيام" : "يوم";
      counterEl.style.color = "var(--top2)";
      counterEl.innerHTML = `باقي على بداية شهر رمضان المبارك ${diffDays} ${unit}`;
    } else if (diffDays === 0 || (diffDays < 0 && diffDays > -30)) {
      // عند حلول رمضان (ولمدة 30 يوم)
      counterEl.style.color = "var(--red)";
      counterEl.style.fontSize = "clamp(24px, 4vw, 55px)";
      counterEl.innerHTML = "رمضان مبارك 🌙";
    } else {
      counterEl.innerHTML = ""; // إخفاء العداد بعد رمضان
    }
  }

  function setClockAndDates(){
    const now = new Date();
    const timeStr = now.toLocaleTimeString("en-GB", { hour12:false, timeZone:CONFIG.tz });
    $("mainClock").textContent = timeStr;

    const options = { day:"2-digit", month:"2-digit", year:"numeric", timeZone:CONFIG.tz };
    $("dateG").textContent = new Intl.DateTimeFormat("en-GB", options).format(now);
    
    const dayName = new Intl.DateTimeFormat("ar-EG", { weekday:"long", timeZone:CONFIG.tz }).format(now);
    $("dayName").textContent = dayName;

    // التاريخ الهجري
    const h = moment().format('iDay iMMMM iYYYY');
    $("hijriText").textContent = h + " هـ";

    updateRamadanCountdown(); // استدعاء تحديث عداد رمضان
  }

  // --- بقية الدوال الأساسية للكود (محملة من ملفك الأصلي) ---
  async function loadTimings(){
    try{
      const lat=32.42, lng=35.01;
      const url = `https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=${CONFIG.method}`;
      const resp = await fetch(url);
      const json = await resp.json();
      const t = json.data.timings;
      const list = ["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"];
      list.forEach(k => { if($( `time-${k}`)) $( `time-${k}`).textContent = t[k]; });
      window.cachedTimings = t;
    }catch(e){ console.error(e); }
  }

  async function fetchWeather(){
    try{
      const url = `https://api.openweathermap.org/data/2.5/weather?q=Baqat%20al-Gharbiya&units=metric&appid=da2586e300665f299839f993f4115456&lang=ar`;
      const r = await fetch(url);
      const d = await r.json();
      if(d.main){
        $("weatherWrap").style.display="flex";
        $("wTemp").textContent = Math.round(d.main.temp) + "°";
        $("wDesc").textContent = d.weather[0].description;
      }
    }catch(e){}
  }

  // التكرار الدوري
  setInterval(setClockAndDates, 1000);
  setClockAndDates();
  loadTimings();
  fetchWeather();
  setInterval(loadTimings, 3600000); // كل ساعة
  setInterval(fetchWeather, 1800000); // كل نصف ساعة

  // بيانات افتراضية للآية
  const verses = ["إِنَّ مَعَ الْعُسْرِ يُسْرًا", "وَقُلْ رَبِّ زِدْنِي عِلْمًا", "فَاذْكُرُونِي أَذْكُرْكُمْ"];
  $("verseTrack").textContent = verses[Math.floor(Math.random()*verses.length)];
  </script>

</body>
</html>
