<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>توقيت الأذان في مدرسة الغزالي باقة الغربية</title>

  <style>
    @font-face{
      font-family: "HacenScreen";
      src: url("font/Hacen%20Liner%20Screen%20St%20Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root{
      --bg:#f6f2ea;
      --ink:#111;
      --muted:#4a4a4a;

      --top:#9a6a35;
      --top2:#7b542a;

      --red:#c91c1c;

      --green-bg: #e8f5e9;
      --green-border: #2e7d32;
      --green-text: #1b5e20;

      --line:#cbb9a3;
      --arab:#7a5a34;

      --s: clamp(16px, 2.15vw, 34px);

      --tickerSpeed: 28s;
      --verseSpeed: 40s;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      height:100vh;
      width:100vw;
      overflow:hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "HacenScreen", system-ui, Tahoma, Arial, sans-serif;
    }

    /* ✅ وضع رمضان */
    body[data-ramadan="1"]{
      background:
        radial-gradient(circle at 50% 10%, rgba(201,161,74,.18), rgba(246,242,234,0) 55%),
        var(--bg);
    }

    @keyframes antiBurn {
      0% { transform: translate(0, 0); }
      25% { transform: translate(2px, 1px); }
      50% { transform: translate(0, 2px); }
      75% { transform: translate(-2px, 1px); }
      100% { transform: translate(0, 0); }
    }

    .frame{
      height:100vh;
      width:100vw;
      position:relative;
      display:flex;
      align-items:stretch;
      justify-content:center;
      padding: clamp(10px, 1.8vw, 22px);
      background:
        linear-gradient(90deg, rgba(122,90,52,.18), rgba(122,90,52,0) 18%),
        linear-gradient(270deg, rgba(122,90,52,.18), rgba(122,90,52,0) 18%),
        var(--bg);
      animation: antiBurn 300s infinite alternate linear;
    }

    body[data-ramadan="1"] .frame{
      background:
        radial-gradient(circle at 50% 0%, rgba(201,161,74,.15), rgba(246,242,234,0) 50%),
        linear-gradient(90deg, rgba(122,90,52,.18), rgba(122,90,52,0) 18%),
        linear-gradient(270deg, rgba(122,90,52,.18), rgba(122,90,52,0) 18%),
        var(--bg);
    }

    .arab-border{
      position:absolute;
      top:0; bottom:0;
      width: clamp(22px, 3.2vw, 52px);
      opacity:.9;
      background-color: transparent;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='120' viewBox='0 0 40 120'><rect width='40' height='120' fill='none'/><path d='M8,0 C20,12 20,28 8,40 C-4,52 -4,68 8,80 C20,92 20,108 8,120' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/><path d='M32,0 C20,12 20,28 32,40 C44,52 44,68 32,80 C20,92 20,108 32,120' fill='none' stroke='%237a5a34' stroke-width='6' stroke-linecap='round'/></svg>");
      background-repeat: repeat-y;
      background-size: 100% auto;
      filter: saturate(1.1);
      pointer-events:none;
    }
    .arab-border.right{ right:0; }
    .arab-border.left{ left:0; transform: scaleX(-1); }

    .board{
      width:min(1100px, 100%);
      height:100%;
      background: rgba(246,242,234,.90);
      border: 3px solid var(--line);
      box-shadow: 0 18px 70px rgba(0,0,0,.14);
      position:relative;
      display:flex;
      flex-direction:column;
      padding: clamp(12px, 2vw, 24px);
      border-radius: 16px;
      overflow:hidden;
      isolation:isolate;
    }

    body[data-ramadan="1"] .board{
      border-color: rgba(201,161,74,.55);
      box-shadow: 0 22px 85px rgba(0,0,0,.16);
    }

    .grain{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      opacity:.06;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.35'/></svg>");
      background-size: 220px 220px;
      mix-blend-mode:multiply;
    }

    .content{
      position:relative;
      z-index:1;
      height:100%;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      background: linear-gradient(90deg, var(--top2), var(--top), var(--top2));
      color:#fff;
      border-radius: 12px;
      padding: calc(var(--s)*0.62) calc(var(--s)*0.8);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    body[data-ramadan="1"] .topbar{
      background: linear-gradient(90deg, #6f4b18, #c9a14a, #6f4b18);
      box-shadow: 0 10px 30px rgba(201,161,74,.22);
    }

    .topbar .right{
      display:flex; align-items:center; gap:12px;
      font-weight:1000;
      font-size: calc(var(--s)*1.05);
      line-height:1.1;
    }
    .logo{
      width: calc(var(--s)*2.1);
      height: calc(var(--s)*2.1);
      border-radius: 12px;
      overflow:hidden;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.35);
      flex:0 0 auto;
      display:flex; align-items:center; justify-content:center;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .topbar .left{
      font-weight:1000;
      font-size: calc(var(--s)*0.90);
      opacity:.95;
      text-align:left;
      white-space:nowrap;
    }

    .clock{
      text-align:center;
      margin-top: calc(var(--s)*0.60);
      font-weight: 1000;
      letter-spacing: 1px;
      color:#111;
    }
    .clock .t{
      font-size: clamp(70px, 10vw, 140px);
      line-height:1;
    }

    .meta{
      text-align:center;
      margin-top: calc(var(--s)*0.25);
      font-weight: 1000;
      line-height:1.2;
    }
    .meta .row1{
      display:flex;
      justify-content:center;
      gap: calc(var(--s)*1.0);
      flex-wrap:wrap;
      font-size: clamp(20px, 2.8vw, 42px);
    }
    .meta .row2{
      margin-top: calc(var(--s)*0.15);
      font-size: clamp(16px, 2.1vw, 32px);
      color:#222;
    }

    .weather-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      margin-bottom: 5px;
      background-color: rgba(123, 84, 42, 0.08);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      padding: 6px 20px;
      border-radius: 50px;
      border: 1px solid rgba(123, 84, 42, 0.15);
      color: #7b542a;
      font-weight: 1000;
      font-size: clamp(16px, 2.0vw, 30px);
    }
    .w-icon { font-size: 1.3em; margin-top:-4px; }
    .w-temp { direction: ltr; font-weight:1000; }

    .times{
      margin-top: calc(var(--s)*0.55);
      display:flex;
      flex-direction:column;
      gap: calc(var(--s)*0.52);
      padding: calc(var(--s)*0.55) calc(var(--s)*0.65);
      border-radius: 14px;
    }

    /* ✅ محاذاة التوقيت لليمين (RTL حقيقي) */
    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-direction: row-reverse; /* الوقت يصبح يمينًا */
      border-bottom: 2px solid rgba(155,120,80,.25);
      padding: calc(var(--s)*0.18) 0 calc(var(--s)*0.25);
      font-size: clamp(24px, 3.2vw, 50px);
      font-weight:1000;
      transition: all 0.5s ease;
    }

    .item .name{
      color:#111;
      display:flex;
      align-items:center;
      gap: 15px;
      justify-content:flex-start;
    }

    .item .name .icon {
      font-size: 1.2em;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
    }

    .item .val{
      color: var(--red);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      min-width: 12ch;
      text-align:right;
      direction:ltr;
      display:inline-flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
    }

    .magBadge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-inline-start: 10px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 2px solid rgba(201,161,74,.55);
      background: rgba(201,161,74,.14);
      color:#7b542a;
      font-weight:1000;
      font-size: .62em;
      white-space:nowrap;
      direction:rtl;
    }
    .magBadge .num{
      direction:ltr;
      color:#111;
      font-weight:1000;
    }

    .item.next{
      border-bottom-color: var(--green-border);
      background: var(--green-bg);
      border-radius: 16px;
      padding-inline: calc(var(--s)*0.6);
      box-shadow: 0 0 15px rgba(46, 125, 50, 0.15);
      border: 2px solid var(--green-border);
      transform: scale(1.02);
    }
    .item.next .val { color: var(--green-text); }
    .item.next .name { color: var(--green-text); }

    .badge-next{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size: .65em;
      color: var(--green-text);
      opacity:.95;
      margin-inline-start: 10px;
      white-space:nowrap;
      background: rgba(255,255,255,0.6);
      padding: 2px 10px;
      border-radius: 20px;
    }
    .badge-dot{
      width:10px;height:10px;border-radius:50%;
      background: #43a047;
      box-shadow: 0 0 0 4px rgba(67, 160, 71, 0.2);
      flex:0 0 auto;
      animation: pulseGreen 2s infinite;
    }
    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(67, 160, 71, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(67, 160, 71, 0); }
      100% { box-shadow: 0 0 0 0 rgba(67, 160, 71, 0); }
    }

    .countdown{
      margin-top: calc(var(--s)*0.55);
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid rgba(90,150,210,.35);
      background: rgba(160, 210, 255, .22);
      color:#0b1d2a;
      font-weight:1000;
      text-align:center;
      font-size: calc(var(--s)*1.05);
    }

    /* ✅ رسالة رمضان بدل العداد أثناء الدوام */
    .ramadanGreeting{
      margin-top: calc(var(--s)*0.55);
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid rgba(201,161,74,.45);
      background: rgba(201,161,74,.14);
      color:#5b3b10;
      font-weight:1000;
      text-align:center;
      font-size: calc(var(--s)*1.05);
      display:none;
    }

    .verseWrap{
      margin-top: calc(var(--s)*0.45);
      display:flex;
      align-items:center;
      gap:12px;
      padding: 0 calc(var(--s)*0.65);
    }
    .verseLabel{
      font-weight:1000;
      color:#7b542a;
      font-size: calc(var(--s)*0.88);
      white-space:nowrap;
      opacity:.95;
    }
    .verseBar{
      flex: 1 1 auto;
      overflow:hidden;
      border-radius: 12px;
      background: rgba(122,90,52,.08);
      border: 2px solid rgba(122,90,52,.18);
      height: calc(var(--s)*2.55);
      padding-block: 6px;
      display:flex;
      align-items:center;
    }
    .verseTrack{
      display:inline-flex;
      align-items:center;
      white-space:nowrap;
      padding-inline: 22px;
      font-weight:1000;
      font-size: calc(var(--s)*0.98);
      color:#111;
      line-height:1.2;
      animation: verseMove var(--verseSpeed) linear infinite;
    }
    @keyframes verseMove{
      0%{ transform: translateX(-10%); }
      100%{ transform: translateX(110%); }
    }

    body[data-ramadan="1"] .verseBar{
      background: rgba(201,161,74,.12);
      border-color: rgba(201,161,74,.35);
    }

    .tickerWrap{
      margin-top:auto;
      border-top: 3px solid rgba(155,120,80,.35);
      padding-top: calc(var(--s)*0.55);
      display:flex;
      align-items:center;
    }
    .ticker{
      position:relative;
      flex:1 1 auto;
      overflow:hidden;
      border-radius: 12px;
      background: rgba(155,120,80,.10);
      border: 2px solid rgba(155,120,80,.22);
      height: calc(var(--s)*2.05);
      display:flex;
      align-items:center;
    }
    body[data-ramadan="1"] .ticker{
      background: rgba(201,161,74,.12);
      border-color: rgba(201,161,74,.30);
    }
    .ticker .track{
      display:inline-flex;
      align-items:center;
      gap: 34px;
      white-space:nowrap;
      padding-inline: 18px;
      font-weight:1000;
      font-size: calc(var(--s)*0.95);
      color:#111;
      animation: tickerMove var(--tickerSpeed) linear infinite;
    }
    @keyframes tickerMove{
      0%{ transform: translateX(-10%); }
      100%{ transform: translateX(110%); }
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="arab-border right"></div>
    <div class="arab-border left"></div>

    <div class="board">
      <div class="grain"></div>

      <div class="content">
        <div class="topbar">
          <div class="right">
            <div class="logo"><img id="logoImg" src="logo.png" alt="logo"></div>
            <div id="titleText">توقيت الأذان في مدرسة الغزالي</div>
          </div>
          <div class="left" id="locText">باقة الغربية</div>
        </div>

        <div class="clock">
          <div class="t" id="clockText">00:00:00</div>
        </div>

        <div class="meta">
          <div class="row1">
            <div id="dowText">—</div>
            <div id="monthText">—</div>
          </div>
          <div class="row2" id="gregText">—</div>
          <div class="row2" id="hijriText" style="margin-top:8px;">—</div>

          <div class="weather-row" id="weatherWrap" style="display:none">
            <span id="wIcon" class="w-icon">⛅</span>
            <span id="wTemp" class="w-temp">--°C</span>
            <span id="wDesc" class="w-desc">--</span>
          </div>
        </div>

        <div class="times" aria-label="أوقات الأذان">
          <div class="item" data-key="Fajr">
            <span class="name"><span class="icon">🌌</span> الفجر</span>
            <span class="val" id="fajr">--:--</span>
          </div>

          <div class="item" data-key="Sunrise">
            <span class="name"><span class="icon">🌅</span> الشروق</span>
            <span class="val" id="sunrise">--:--</span>
          </div>

          <div class="item" data-key="Dhuhr">
            <span class="name"><span class="icon">☀️</span> الظهر</span>
            <span class="val" id="dhuhr">--:--</span>
          </div>

          <div class="item" data-key="Asr">
            <span class="name"><span class="icon">🌤️</span> العصر</span>
            <span class="val" id="asr">--:--</span>
          </div>

          <div class="item" data-key="Maghrib">
            <span class="name"><span class="icon">🌇</span> المغرب</span>
            <span class="val" id="maghrib">--:--</span>
          </div>

          <div class="item" data-key="Isha">
            <span class="name"><span class="icon">🌙</span> العشاء</span>
            <span class="val" id="isha">--:--</span>
          </div>
        </div>

        <div class="countdown" id="countdownText">⏳ الوقت المتبقي للأذان القادم: —</div>

        <div class="ramadanGreeting" id="ramadanGreeting">
          🌙 رمضان مبارك.. تقبّل الله الطاعات 🤲
        </div>

        <div class="verseWrap">
          <div class="verseLabel" id="verseLabel">📖 آية</div>
          <div class="verseBar">
            <div class="verseTrack" id="verseTrack">—</div>
          </div>
        </div>

        <div class="tickerWrap">
          <div class="ticker">
            <div class="track" id="tickerTrack">—</div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const CONFIG = {
    label: "باقة الغربية",
    lat: 32.4169,
    lon: 35.0405,
    tz: "Asia/Jerusalem",
    method: 3,
    offsets: { Fajr: -1, Dhuhr: 1, Asr: 2, Maghrib: 9, Isha: 6, Sunrise: -5 },

    // ✅ ساعات عمل الشاشة
    screenOnFrom: "07:00",
    screenOnTo:   "13:00",

    versesFile: "verses.json",
    versesRamadanFile: "verses_ramadan.json", // اختياري: إن لم يوجد سيرجع تلقائيًا لـ verses.json
    verseChangeMinutes: 5,
    verseSpeedSeconds: 40,

    tickerMessages: [
      "🌟 يومكم جميل مثلكم يا أبطال الغزالي",
      "📚 تذكير: نعتني بكتبنا",
      "✅ سلوك اليوم: نحترم دور غيرنا",
      "🧼 نغسل أيدينا باستمرار",
      "🤝 معًا نصنع يومًا جميلًا",
      "😊 الابتسامة صدقة"
    ],
    tickerMessagesRamadan: [
      "🌙 رمضان كريم: لسان طيب.. وقلب طيب",
      "🤲 تقبّل الله طاعتكم",
      "🕌 في رمضان: نحافظ على الهدوء احترامًا للصائمين",
      "💛 صدقة بسيطة تصنع فرقًا",
      "📖 كل يوم آية.. وكل آية نور"
    ],
    tickerSpeedSeconds: 28
  };

  const $ = (id)=>document.getElementById(id);

  function pad(n){ return String(n).padStart(2,"0"); }

  // ✅ استخراج HH:MM بأمان (بدون قص غلط)
  function extractHHMM(s){
    const m = String(s || "").match(/(\d{1,2}):(\d{2})/);
    if(!m) return "--:--";
    return `${pad(Number(m[1]))}:${m[2]}`;
  }

  function nowInTZ(){
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: CONFIG.tz,
      year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", second:"2-digit",
      hourCycle:"h23"
    }).formatToParts(new Date());

    const y  = Number(parts.find(p=>p.type==="year")?.value);
    const mo = Number(parts.find(p=>p.type==="month")?.value);
    const da = Number(parts.find(p=>p.type==="day")?.value);
    const hh = Number(parts.find(p=>p.type==="hour")?.value);
    const mm = Number(parts.find(p=>p.type==="minute")?.value);
    const ss = Number(parts.find(p=>p.type==="second")?.value);

    return new Date(y, mo-1, da, hh, mm, ss, 0);
  }

  function nowPartsTZ(){
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: CONFIG.tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"
    }).formatToParts(new Date());
    return {
      hh: parts.find(p=>p.type==="hour")?.value || "00",
      mm: parts.find(p=>p.type==="minute")?.value || "00",
      ss: parts.find(p=>p.type==="second")?.value || "00"
    };
  }

  function setClockAndDates(){
    const {hh,mm,ss} = nowPartsTZ();
    $("clockText").textContent = `${hh}:${mm}:${ss}`;
    const d = new Date();
    $("dowText").textContent = new Intl.DateTimeFormat("ar", { weekday:"long", timeZone: CONFIG.tz }).format(d);
    $("monthText").textContent = new Intl.DateTimeFormat("ar", { month:"long", timeZone: CONFIG.tz }).format(d);
    const greg = new Intl.DateTimeFormat("en-CA", { year:"numeric", month:"2-digit", day:"2-digit", timeZone: CONFIG.tz }).format(d);
    $("gregText").textContent = greg;
  }

  function addMinutesToHHMM(hhmm, addMin){
    const clean = extractHHMM(hhmm);
    const [hS, mS] = clean.split(":");
    const h = Number(hS), m = Number(mS);
    if(!Number.isFinite(h) || !Number.isFinite(m)) return "--:--";
    let total = (h*60 + m) + (addMin||0);
    total = ((total % (24*60)) + (24*60)) % (24*60);
    const hh = Math.floor(total / 60);
    const mm = total % 60;
    return `${pad(hh)}:${pad(mm)}`;
  }

  async function fetchTimings(){
    const d = new Date();
    const parts = new Intl.DateTimeFormat("en-US", {
      year: "numeric", month: "numeric", timeZone: CONFIG.tz
    }).formatToParts(d);

    const month = parts.find(p=>p.type==="month").value;
    const year  = parts.find(p=>p.type==="year").value;

    const url =
      `https://api.aladhan.com/v1/calendar` +
      `?latitude=${encodeURIComponent(CONFIG.lat)}` +
      `&longitude=${encodeURIComponent(CONFIG.lon)}` +
      `&method=${encodeURIComponent(CONFIG.method)}` +
      `&month=${month}&year=${year}`;

    const r = await fetch(url, { cache: "no-store" });
    if(!r.ok) throw new Error("Fetch failed");
    const j = await r.json();
    if(j.code !== 200) throw new Error("Bad response");
    return j.data;
  }

  function getZonedDateStr(){
    const iso = new Intl.DateTimeFormat("en-CA", {
      year: "numeric", month: "2-digit", day: "2-digit", timeZone: CONFIG.tz
    }).format(new Date());
    const [y, m, d] = iso.split("-");
    return `${d}-${m}-${y}`;
  }

  function getZonedISODate(){
    return new Intl.DateTimeFormat("en-CA", {
      year: "numeric", month: "2-digit", day: "2-digit", timeZone: CONFIG.tz
    }).format(new Date());
  }

  function parseTodayHHMM(hhmm){
    const clean = extractHHMM(hhmm);
    const [hS, mS] = clean.split(":");
    const h = Number(hS), m = Number(mS);
    if(!Number.isFinite(h) || !Number.isFinite(m)) return null;

    const y  = Number(new Intl.DateTimeFormat("en-CA",{year:"numeric",timeZone:CONFIG.tz}).format(new Date()));
    const mo = Number(new Intl.DateTimeFormat("en-CA",{month:"2-digit",timeZone:CONFIG.tz}).format(new Date()));
    const da = Number(new Intl.DateTimeFormat("en-CA",{day:"2-digit",timeZone:CONFIG.tz}).format(new Date()));
    return new Date(y, mo-1, da, h, m, 0, 0);
  }

  const ORDER = ["Fajr","Dhuhr","Asr","Maghrib","Isha"];
  const NAME_AR = {Fajr:"الفجر",Sunrise:"الشروق",Dhuhr:"الظهر",Asr:"العصر",Maghrib:"المغرب",Isha:"العشاء"};

  let timingsAdj = null;
  let IS_RAMADAN = false;

  function getNextPrayer(){
    if(!timingsAdj) return null;
    const now = nowInTZ();

    for(const k of ORDER){
      const at = parseTodayHHMM(timingsAdj[k]);
      if(!at) continue;
      if(at > now) return { key:k, at };
    }

    const atTomorrow = parseTodayHHMM(timingsAdj["Fajr"]);
    if(!atTomorrow) return null;
    atTomorrow.setDate(atTomorrow.getDate() + 1);
    return { key:"Fajr", at: atTomorrow };
  }

  function updateNextHighlight(){
    const next = getNextPrayer();
    const items = document.querySelectorAll(".times .item");
    items.forEach(it=>{
      it.classList.remove("next");
      const badge = it.querySelector(".badge-next");
      if(badge) badge.remove();
    });
    if(!next) return;

    const el = document.querySelector(`.times .item[data-key="${next.key}"]`);
    if(!el) return;

    el.classList.add("next");
    const badge = document.createElement("span");
    badge.className = "badge-next";
    badge.innerHTML = `<span class="badge-dot"></span> التالي`;
    el.querySelector(".name").appendChild(badge);
  }

  function isWithinScreenHours(){
    const now = nowInTZ();
    const [aH,aM] = CONFIG.screenOnFrom.split(":").map(Number);
    const [bH,bM] = CONFIG.screenOnTo.split(":").map(Number);
    const from = new Date(now.getFullYear(), now.getMonth(), now.getDate(), aH, aM, 0, 0);
    const to   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), bH, bM, 0, 0);
    return now >= from && now <= to;
  }

  function applyRamadanMode(isOn){
    IS_RAMADAN = !!isOn;
    document.body.setAttribute("data-ramadan", IS_RAMADAN ? "1" : "0");
    $("verseLabel").textContent = IS_RAMADAN ? "📖 آية رمضانية" : "📖 آية";
    $("titleText").textContent = IS_RAMADAN ? "توقيت الأذان في مدرسة الغزالي 🌙" : "توقيت الأذان في مدرسة الغزالي";
    setTickerMode(IS_RAMADAN);
    ensureIftarBadge();
    updateIftarBadge();
    loadVersesForMode();
  }

  function ensureIftarBadge(){
    const magEl = $("maghrib");
    if(!magEl) return;

    const existing = magEl.querySelector(".magBadge");
    if(!IS_RAMADAN){
      if(existing) existing.remove();
      return;
    }

    if(!existing){
      const b = document.createElement("span");
      b.className = "magBadge";
      b.innerHTML = `🍽️ <span>الوقت المتبقي للإفطار:</span> <span class="num" id="iftarRemain">—</span>`;
      magEl.appendChild(b);
    }
  }

  // ✅ حساب مضبوط للدقائق (لا يضيّع دقيقتين)
  function formatIftarFull(ms){
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const hours = Math.floor(totalSec / 3600);
    const minutes = Math.floor((totalSec % 3600) / 60);
    if(hours > 0) return `${hours} ساعات و${minutes} دقائق`;
    return `${minutes} دقائق`;
  }

  function updateIftarBadge(){
    if(!IS_RAMADAN || !timingsAdj) return;
    const remainEl = $("iftarRemain");
    if(!remainEl) return;

    const now = nowInTZ();
    let magAt = parseTodayHHMM(timingsAdj.Maghrib);
    if(!magAt) { remainEl.textContent = "—"; return; }

    if(magAt <= now){
      magAt = new Date(magAt.getTime());
      magAt.setDate(magAt.getDate() + 1);
    }

    remainEl.textContent = formatIftarFull(magAt - now);
  }

  function formatRemainingTime(sec){
    if(sec < 0) return "";
    if(sec < 60) return "أقل من دقيقة";
    const hours = Math.floor(sec / 3600);
    const minutes = Math.floor((sec % 3600) / 60);
    if(hours > 0) return `${hours} ساعات و${minutes} دقائق`;
    return `${minutes} دقائق`;
  }

  function updateCountdownOrGreeting(){
    const countdown = $("countdownText");
    const greet = $("ramadanGreeting");

    if(IS_RAMADAN && isWithinScreenHours()){
      countdown.style.display = "none";
      greet.style.display = "block";
      return;
    }

    greet.style.display = "none";
    countdown.style.display = "block";

    if(!timingsAdj) return;
    const now = nowInTZ();
    const next = getNextPrayer();
    if(!next) return;

    const secLeft = Math.floor((next.at - now) / 1000);
    if(secLeft < 0) return;

    if(IS_RAMADAN && next.key === "Maghrib"){
      countdown.textContent = `🍽️ الوقت المتبقي للإفطار (أذان المغرب): ${formatRemainingTime(secLeft)}`;
      return;
    }

    const nameAr = NAME_AR[next.key] || next.key;
    countdown.textContent = `⏳ الوقت المتبقي للأذان القادم (${nameAr}): ${formatRemainingTime(secLeft)}`;
  }

  function applyData(monthData){
    if(!Array.isArray(monthData)) return;
    const todayStr = getZonedDateStr();
    const todayEntry = monthData.find(d => d.date.gregorian.date === todayStr);
    if(!todayEntry) return;

    const h = todayEntry.date.hijri;
    if(h){
      $("hijriText").textContent = `${h.day} ${h.month?.ar || ""} ${h.year}`;
      const isRam = (Number(h.month?.number) === 9) || String(h.month?.ar || "").includes("رمضان");
      applyRamadanMode(isRam);
    }else{
      $("hijriText").textContent = "—";
      applyRamadanMode(false);
    }

    const t = todayEntry.timings;

    timingsAdj = {
      Fajr:    addMinutesToHHMM(t.Fajr,    CONFIG.offsets.Fajr || 0),
      Dhuhr:   addMinutesToHHMM(t.Dhuhr,   CONFIG.offsets.Dhuhr || 0),
      Asr:     addMinutesToHHMM(t.Asr,     CONFIG.offsets.Asr || 0),
      Maghrib: addMinutesToHHMM(t.Maghrib, CONFIG.offsets.Maghrib || 0),
      Isha:    addMinutesToHHMM(t.Isha,    CONFIG.offsets.Isha || 0),
      Sunrise: addMinutesToHHMM(t.Sunrise, CONFIG.offsets.Sunrise || 0)
    };

    $("fajr").textContent = timingsAdj.Fajr;
    $("dhuhr").textContent = timingsAdj.Dhuhr;
    $("asr").textContent = timingsAdj.Asr;
    $("maghrib").textContent = timingsAdj.Maghrib;
    $("isha").textContent = timingsAdj.Isha;
    $("sunrise").textContent = timingsAdj.Sunrise;

    ensureIftarBadge();
    updateNextHighlight();
    updateIftarBadge();
    updateCountdownOrGreeting();
  }

  // Ticker
  let tickerIndex = 0;
  let TICKER_LIST = CONFIG.tickerMessages;

  function setTickerText(msg){
    $("tickerTrack").textContent = `• ${msg} • ${msg} • ${msg}`;
  }
  function setTickerMode(isRamadan){
    const nextList = isRamadan ? (CONFIG.tickerMessagesRamadan || CONFIG.tickerMessages) : CONFIG.tickerMessages;
    if(TICKER_LIST === nextList) return;
    TICKER_LIST = nextList;
    tickerIndex = 0;
    setTickerText(TICKER_LIST[tickerIndex % TICKER_LIST.length]);
  }
  function startTicker(){
    document.documentElement.style.setProperty("--tickerSpeed", `${CONFIG.tickerSpeedSeconds}s`);
    setTickerText(TICKER_LIST[tickerIndex % TICKER_LIST.length]);
    const intervalMs = Math.max(8000, (CONFIG.tickerSpeedSeconds * 1000) - 1000);
    setInterval(()=>{
      tickerIndex++;
      setTickerText(TICKER_LIST[tickerIndex % TICKER_LIST.length]);
    }, intervalMs);
  }

  // Verses
  const VERSE_LS = "ghazali_verse_index_v1";
  let verseRefs = [];
  let verseTimer = null;

  async function loadVersesRefs(path){
    const r = await fetch(path, { cache: "no-store" });
    if(!r.ok) throw new Error("Cannot load verses file");
    return await r.json();
  }

  function getVerseIndex(){
    const raw = localStorage.getItem(VERSE_LS);
    const idx = Number(raw || 0);
    return Number.isFinite(idx) && idx >= 0 ? idx : 0;
  }
  function setVerseIndex(idx){
    try{ localStorage.setItem(VERSE_LS, String(idx)); }catch{}
  }

  async function fetchVerseText(surah, ayah){
    const url = `https://api.alquran.cloud/v1/ayah/${surah}:${ayah}/ar`;
    const r = await fetch(url, { cache: "no-store" });
    if(!r.ok) throw new Error("Verse fetch failed");
    const j = await r.json();
    return j?.data?.text || "";
  }

  function setVerseTrackText(text){
    $("verseTrack").textContent = `• ${text} • ${text}`;
  }

  async function showVerseAt(index){
    if(!verseRefs.length) { setVerseTrackText("—"); return; }
    const idx = index % verseRefs.length;
    const ref = verseRefs[idx];
    try{
      const text = await fetchVerseText(ref.surah, ref.ayah);
      setVerseTrackText(text || "—");
    }catch{
      setVerseTrackText("—");
    }
    setVerseIndex(idx);
  }

  function startVerseLoop(){
    document.documentElement.style.setProperty("--verseSpeed", `${CONFIG.verseSpeedSeconds}s`);
    if(verseTimer) { clearInterval(verseTimer); verseTimer = null; }
    const idx = getVerseIndex();
    showVerseAt(idx);
    verseTimer = setInterval(async ()=>{
      const cur = getVerseIndex();
      await showVerseAt(cur + 1);
    }, CONFIG.verseChangeMinutes * 60 * 1000);
  }

  async function loadVersesForMode(){
    try{
      const primary = IS_RAMADAN ? CONFIG.versesRamadanFile : CONFIG.versesFile;
      let list = null;
      try{ list = await loadVersesRefs(primary); }
      catch{ list = await loadVersesRefs(CONFIG.versesFile); }

      verseRefs = Array.isArray(list) ? list : [];
      startVerseLoop();
    }catch{
      verseRefs = [];
      $("verseTrack").textContent = "—";
    }
  }

  // Weather
  function wmoToText(code){
    if(code === 0) return { t:"مشمس وصافٍ", i:"☀️" };
    if(code >= 1 && code <= 3) return { t:"غائم جزئيًا", i:"⛅" };
    if(code >= 45 && code <= 48) return { t:"ضبابي", i:"🌫️" };
    if(code >= 51 && code <= 55) return { t:"رذاذ خفيف", i:"🌦️" };
    if(code >= 61 && code <= 67) return { t:"ماطر", i:"🌧️" };
    if(code >= 71 && code <= 77) return { t:"مثلج", i:"🌨️" };
    if(code >= 80 && code <= 82) return { t:"زخات مطر", i:"🌦️" };
    if(code >= 95) return { t:"عاصف وماطر", i:"⛈️" };
    return { t:"صافٍ", i:"☀️" };
  }

  async function fetchWeather(){
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&current_weather=true`;
      const r = await fetch(url);
      const j = await r.json();
      if(j.current_weather){
        const {temperature, weathercode} = j.current_weather;
        const info = wmoToText(weathercode);
        $("wIcon").textContent = info.i;
        $("wTemp").textContent = `${Math.round(temperature)}°C`;
        $("wDesc").textContent = info.t;
        $("weatherWrap").style.display = "flex";
      }
    }catch{
      $("weatherWrap").style.display = "none";
    }
  }

  // Cache timings
  const LS_KEY = "ghazali_timings_month_v2";
  function saveCache(payload){ try{ localStorage.setItem(LS_KEY, JSON.stringify(payload)); }catch{} }
  function readCache(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch{ return null; } }

  async function loadTimings(){
    try{
      const data = await fetchTimings();
      applyData(data);
      saveCache({ monthKey: getZonedDateStr().substring(3), data, updatedAt: Date.now() });
    }catch{
      const cached = readCache();
      if(cached && cached.data){
        applyData(cached.data);
      }
    }
  }

  // INIT
  const logo = $("logoImg");
  logo.onerror = ()=>{ logo.style.display="none"; };
  $("locText").textContent = CONFIG.label;

  startTicker();
  setClockAndDates();
  fetchWeather();
  loadTimings();
  loadVersesForMode();

  setInterval(()=>{
    setClockAndDates();
    updateNextHighlight();
    updateIftarBadge();
    updateCountdownOrGreeting();
  }, 1000);

  setInterval(()=>fetchWeather(), 30 * 60 * 1000);
  setInterval(()=>loadTimings(), 6 * 60 * 60 * 1000);

  let lastDayStr = getZonedISODate();
  setInterval(()=>{
    const currentDayStr = getZonedISODate();
    if(currentDayStr !== lastDayStr){
      lastDayStr = currentDayStr;
      loadTimings();
      loadVersesForMode();
    }
  }, 60000);
</script>
</body>
